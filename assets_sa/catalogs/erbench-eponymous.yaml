metadata:
  name: erbench-eponymous
  display_name: "erbench-eponymous*"
  version: 3
  benchmark: "erbench"
  tags: {"origin": "science formula", "tags": ["extrapolation", "dummy inputs", "srbf-modified"]}
  description: ERBench Eponymous family (195 entries after deduplication; headline eval tier); one problem per formula and
    alpha (ERBench's generator).
  sources:
  - ERBench (Kahlmeyer, Voigt, Habeck & Giesen, arXiv:2606.09276)
  - HuggingFace dataset EquationDiscovery/Equation_Recovery_Benchmark
  license: CC-BY-SA-4.0 (Wikipedia-derived; see assets_sa LICENSE)
  citation: {"paper": {"short": "Kahlmeyer et al. 2026", "title": "ERBench: A Benchmark and Testsuite for Equation Discovery Algorithms", "venue": "arXiv preprint arXiv:2606.09276", "url": "https://arxiv.org/abs/2606.09276"}, "data": {"short": "Hugging Face EquationDiscovery/Equation_Recovery_Benchmark@95bf15c", "title": "ERBench Equation_Recovery_Benchmark (train.csv + reference generator)", "url": "https://huggingface.co/datasets/EquationDiscovery/Equation_Recovery_Benchmark/tree/95bf15c27de68c3f170ca6140d2e4a811c60344f"}}
  srbf_changes: [{"kind": "changed", "problems": 48, "text": "16 of ERBench's 211 Eponymous formulas are exact copies of another formula in the set (same expression, input box and type); srbf keeps each once, so it runs 585 of the 633 problems."}]
  problem_flags: {"trivial": ["eponymous_22_alpha0", "eponymous_22_alpha0.5", "eponymous_22_alpha1", "eponymous_44_alpha0", "eponymous_44_alpha0.5", "eponymous_44_alpha1", "eponymous_124_alpha0", "eponymous_124_alpha0.5", "eponymous_124_alpha1", "eponymous_137_alpha0", "eponymous_137_alpha0.5", "eponymous_137_alpha1", "eponymous_197_alpha0", "eponymous_197_alpha0.5", "eponymous_197_alpha1"]}
  eval_tier: headline
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  conventions:
    sampling: 'ERBench''s own generator (src/benchmark.py generate_problem / get_samples): one problem per formula and alpha
      in {0, 0.5, 1}; every variable a fresh 1-3 part mixture (uniform sub-interval or normal with sigma = distance to the
      nearer edge / 3; integers: uniform-integer or binomial), clipped to the support; fitting rows in the window [a1, a1
      + (b - a)/2], a1 = a + alpha (b - a)/2; test rows on the rest of the support, split by length; 0 or 1 dummy column per
      problem (drawn once, seeded), its values drawn from the point set''s own values. srbf sets the number of points and
      the noise; invalid rows are redrawn (per-point rejection) where ERBench resamples invalid targets.'
    canonicalization: '''^''->''**'', ''Abs(''->''abs('', log(u,10)->log10-rewrite, x_k->v{k+1}; exact duplicates (expression+support+dtype)
      merged with names in meta.duplicate_of_rows.'
