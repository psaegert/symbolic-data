metadata:
  name: constant
  version: 2
  tags: {"origin": "classic benchmark", "tags": []}
  srbf_changes: [{"kind": "part", "problems": 2, "text": "srbf runs 8 of the 10 'Constant' problems listed in the DSO repository: Const-Test-1 and -2 are software sanity tests, not benchmark problems."}]
  license: "BSD-3-Clause (dso-org/deep-symbolic-optimization benchmarks.csv); formulas and ranges as in each benchmark's first publication (facts)"
  citation: {"paper": {"short": "Petersen et al. 2021", "title": "Deep symbolic regression: Recovering mathematical expressions from data via risk-seeking policy gradients", "venue": "ICLR 2021", "url": "https://arxiv.org/abs/1912.04871"}, "data": {"short": "GitHub dso-org/deep-symbolic-optimization@2069d4e", "title": "DSO benchmark registry benchmarks.csv (uDSR release 2069d4e, BSD-3-Clause)", "url": "https://github.com/dso-org/deep-symbolic-optimization/blob/2069d4eda47b0fd6d3e66e0ade9605cd9574b87c/dso/dso/task/regression/benchmarks.csv"}}
  dropped: "Const-Test-1, Const-Test-2: DSO repository sanity tests, not a benchmark (srbf ruling 2026-11-03)"
  description: Constant-optimization suite (incl. Const-Test sanity checks).
  sources:
  - Petersen et al. 2021 (ICLR), Deep Symbolic Regression, Appendix
  - formulas + ranges from dso-org/deep-symbolic-optimization benchmarks.csv (BSD-3;
    Petersen et al. 2021, Mundhenk et al. 2021)
  sampling_defaults:
    n_points: 20
    method: random
    noise: 0.0
  source_kind: set
  conventions:
    sampling: vars use the `fastsrb` distribution (sample_range/sample_type); DSO
      train_spec ranges; evenly-spaced (E) upstream grids are sampled uniformly here
      (noted per entry as meta.dso_spec).
    validity: 'accepted points follow the declared per-variable distribution CONDITIONED
      on the expression''s valid domain; meta.finite_fraction is the MC-estimated
      per-point valid fraction (n=20000); entries below 0.05 carry low_validity: true
      and need per-entry review.'
expressions:
  Constant-1:
    raw: 3.39*pow(x1,3)+2.12*pow(x1,2)+1.78*x1
    prepared: 3.39*((v1)**(3))+2.12*((v1)**(2))+1.78*v1
    n_variables: 1
    sources:
    - Petersen et al. 2021 (ICLR), Deep Symbolic Regression, Appendix
    - formulas + ranges from dso-org/deep-symbolic-optimization benchmarks.csv (BSD-3;
      Petersen et al. 2021, Mundhenk et al. 2021)
    vars:
      v1:
        name: x1
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    meta:
      dso_spec:
        train:
          all:
            U:
            - -1
            - 1
            - 20
        test: null
        function_set: CKoza
      finite_fraction: 1.0
