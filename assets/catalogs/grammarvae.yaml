metadata:
  name: grammarvae
  version: 2
  tags: {"origin": "classic benchmark", "tags": []}
  license: "BSD-3-Clause (dso-org/deep-symbolic-optimization benchmarks.csv); formulas and ranges as in each benchmark's first publication (facts)"
  citation: {"paper": {"short": "Kusner et al. 2017", "title": "Grammar Variational Autoencoder", "venue": "ICML 2017 (PMLR 70)", "url": "https://arxiv.org/abs/1703.01925"}, "data": {"short": "GitHub dso-org/deep-symbolic-optimization@2069d4e", "title": "DSO benchmark registry benchmarks.csv (uDSR release 2069d4e, BSD-3-Clause)", "url": "https://github.com/dso-org/deep-symbolic-optimization/blob/2069d4eda47b0fd6d3e66e0ade9605cd9574b87c/dso/dso/task/regression/benchmarks.csv"}}
  description: GrammarVAE equation benchmark.
  sources:
  - Kusner et al. 2017 (ICML), Grammar Variational Autoencoder
  - formulas + ranges from dso-org/deep-symbolic-optimization benchmarks.csv (BSD-3;
    Petersen et al. 2021, Mundhenk et al. 2021)
  sampling_defaults:
    n_points: 20
    method: random
    noise: 0.0
  source_kind: set
  conventions:
    sampling: vars use the `fastsrb` distribution (sample_range/sample_type); DSO
      train_spec ranges; evenly-spaced (E) upstream grids are sampled uniformly here
      (noted per entry as meta.dso_spec).
    validity: 'accepted points follow the declared per-variable distribution CONDITIONED
      on the expression''s valid domain; meta.finite_fraction is the MC-estimated
      per-point valid fraction (n=20000); entries below 0.05 carry low_validity: true
      and need per-entry review.'
expressions:
  GrammarVAE-1:
    raw: 1./3+x1+sin(pow(x1,2))
    prepared: 1./3+v1+sin(((v1)**(2)))
    n_variables: 1
    sources:
    - Kusner et al. 2017 (ICML), Grammar Variational Autoencoder
    - formulas + ranges from dso-org/deep-symbolic-optimization benchmarks.csv (BSD-3;
      Petersen et al. 2021, Mundhenk et al. 2021)
    vars:
      v1:
        name: x1
        sample_range:
        - -10.0
        - 10.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    meta:
      dso_spec:
        train:
          all:
            E:
            - -10
            - 10
            - 1000
        test: null
        function_set: GrammarVAE
      finite_fraction: 1.0
