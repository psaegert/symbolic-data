  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-123.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  hierbosss-v1-sim-eq5.2:
    raw: 5*(x1 + x2)*x3
    prepared: 5*v3*(v1 + v2)
    n_variables: 3
    subset: simulated-example
    vars:
      v1:
        name: x1
        dist:
          name: normal
          kwargs:
            loc: 4.0
            scale: 1.0
      v2:
        name: x2
        dist:
          name: normal
          kwargs:
            loc: 6.0
            scale: 1.0
      v3:
        name: x3
        dist:
          name: normal
          kwargs:
            loc: 8.0
            scale: 1.0
      v0:
        name: y
    input_distributions:
      x1: normal N(mean=4, var=1) (sd 1)
      x2: normal N(mean=6, var=1) (sd 1)
      x3: normal N(mean=8, var=1) (sd 1)
    meta:
      finite_fraction: 1.0
