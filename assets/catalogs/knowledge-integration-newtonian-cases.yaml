  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-133.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  ball_drop:
    raw: sqrt(2*9.81*h)
    prepared: 4.42944691807002*sqrt(v1)
    n_variables: 5
    subset: all
    vars:
      v1:
        name: h
        expr: h
      v2:
        name: m
        sample_range:
        - 0.1
        - 10.0
        sample_type:
        - uni
        - pos
      v3:
        name: r
        sample_range:
        - 0.01
        - 0.5
        sample_type:
        - uni
        - pos
      v4:
        name: air_res
        sample_range:
        - 0.0
        - 1.0
        sample_type:
        - uni
        - pos
      v5:
        name: t
        expr: 0.0 + u_t * ((sqrt(2*h/9.81)) - 0.0)
      v0:
        name: y
    input_distributions:
      h: U[1.0, 100.0]
      m: U[0.1, 10.0]
      r: U[0.01, 0.5]
      air_res: U[0.0, 1.0]
      t: 'conditional on h: t | h ~ U[0, sqrt(2*h/9.81)] (one draw per row)'
    latent:
      h:
        sample_range:
        - 1.0
        - 100.0
        sample_type:
        - uni
        - pos
      u_t:
        sample_range:
        - 0.0
        - 1.0
        sample_type:
        - uni
        - pos
    meta:
      finite_fraction: 1.0
  shm:
    raw: 1.0*cos(sqrt(1.0/m)*t + 0.0)
    prepared: 1.0*cos(1.0*v2*sqrt(1/v1))
    n_variables: 5
    subset: all
    vars:
      v1:
        name: m
        sample_range:
        - 0.1
        - 10.0
        sample_type:
        - uni
        - pos
      v2:
        name: t
        expr: 0.0 + u_t * ((sqrt(2*h/9.81)) - 0.0)
      v3:
        name: r
        sample_range:
        - 0.01
        - 0.5
        sample_type:
        - uni
        - pos
      v4:
        name: h
        expr: h
      v5:
        name: air_res
        sample_range:
        - 0.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      m: U[0.1, 10.0]
      t: 'conditional on h: t | h ~ U[0, sqrt(2*h/9.81)] (one draw per row)'
      r: U[0.01, 0.5]
      h: U[1.0, 100.0]
      air_res: U[0.0, 1.0]
    latent:
      h:
        sample_range:
        - 1.0
        - 100.0
        sample_type:
        - uni
        - pos
      u_t:
        sample_range:
        - 0.0
        - 1.0
        sample_type:
        - uni
        - pos
    meta:
      finite_fraction: 1.0
  wave:
    raw: exp(-0.1*t/2)*cos(1.0*0 - 2*pi*t)
    prepared: exp(-0.05*v1)*cos(-2*3.141592653589793*v1 + 0)
    n_variables: 5
    subset: all
    vars:
      v1:
        name: t
        expr: 0.0 + u_t * ((sqrt(2*h/9.81)) - 0.0)
      v2:
        name: m
        sample_range:
        - 0.1
        - 10.0
        sample_type:
        - uni
        - pos
      v3:
        name: r
        sample_range:
        - 0.01
        - 0.5
        sample_type:
        - uni
        - pos
      v4:
        name: h
        expr: h
      v5:
        name: air_res
        sample_range:
        - 0.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      t: 'conditional on h: t | h ~ U[0, sqrt(2*h/9.81)] (one draw per row)'
      m: U[0.1, 10.0]
      r: U[0.01, 0.5]
      h: U[1.0, 100.0]
      air_res: U[0.0, 1.0]
    latent:
      h:
        sample_range:
        - 1.0
        - 100.0
        sample_type:
        - uni
        - pos
      u_t:
        sample_range:
        - 0.0
        - 1.0
        sample_type:
        - uni
        - pos
    meta:
      finite_fraction: 1.0
