  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-136.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  P1:
    raw: 1.883*sin(x1) + 1.61*cos(x0)
    prepared: 1.883*sin(v2) + 1.61*cos(v1)
    n_variables: 2
    subset: simple-id
    vars:
      v1:
        name: x0
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v2:
        name: x1
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x0: uniform U[-1, 1] (each marginal of a Latin hypercube design over [-1,1]^d; scipy.stats.qmc.LatinHypercube scaled
        to [-1,1])
      x1: uniform U[-1, 1] (each marginal of a Latin hypercube design over [-1,1]^d; scipy.stats.qmc.LatinHypercube scaled
        to [-1,1])
    meta:
      finite_fraction: 1.0
  P1.ood:
    raw: 1.883*sin(x1) + 1.61*cos(x0)
    prepared: 1.883*sin(v2) + 1.61*cos(v1)
    n_variables: 2
