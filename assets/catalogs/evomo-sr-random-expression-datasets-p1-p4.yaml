        to [-1,1])
      x1: uniform U[-1, 1] (each marginal of a Latin hypercube design over [-1,1]^d; scipy.stats.qmc.LatinHypercube scaled
        to [-1,1])
    test:
      vars:
        v1:
          dist:
            name: uniform
            kwargs:
              low: -2.0
              high: 2.0
        v2:
          dist:
            name: uniform
            kwargs:
              low: -2.0
              high: 2.0
      row_constraints:
      - 1*(abs(v1) > 1.2) + 1*(abs(v2) > 1.2) == 1
      - 1*(abs(v1) <= 1.0) + 1*(abs(v2) <= 1.0) == 1
    test_source: 'EvoMO-SR random-expression generator, raw/fresh-136/random_data/generate_random_datasets.py l.425-474 and
      random_functions/generation_config.json + manifest.csv (opened): n_train 1000, n_id_test 1000, n_ood_test 2000, id_lower
      -1.0, id_upper 1.0, ood_mode ''axis'', ood_min_distance 1.2, ood_max_distance 2.0; sample_axis_ood: ''Move exactly one
      balanced, randomly ordered coordinate outside ID support'''
    meta:
      finite_fraction: 1.0
