      x2: uniform U[-1,1]
      x3: uniform U[-1,1]
      x4: uniform U[-1,1]
    test:
      vars:
        v1:
          dist:
            name: uniform
            kwargs:
              low: -1.5
              high: 1.5
        v2:
          dist:
            name: uniform
            kwargs:
              low: -1.5
              high: 1.5
        v3:
          dist:
            name: uniform
            kwargs:
              low: -1.5
              high: 1.5
        v4:
          dist:
            name: uniform
            kwargs:
              low: -1.5
              high: 1.5
      row_constraints:
      - maximum.reduce([abs(v1), abs(v2), abs(v3), abs(v4)]) > 1.0
    test_source: 'Martius & Lampert 2016, ''Extrapolation and learning equations'', arXiv:1610.02995v1, results.tex (as quoted
      in the records; no local copy of the paper): training ''uniformly in the hypercube [-h,h] x [-h,h]''; test sets: interpolation
