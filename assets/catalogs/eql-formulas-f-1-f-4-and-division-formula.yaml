metadata:
  name: eql-formulas-f-1-f-4-and-division-formula
  version: 1
  tags: {"origin": "classic benchmark", "tags": ["extrapolation", "several tests"]}
  srbf_changes: []
  license: "facts only: formulas and ranges cited from Martius & Lampert 2016 (arXiv:1610.02995) and Sahoo et al. 2018 (arXiv:1806.07259); no upstream license"
  citation: {"paper": {"short": "Martius & Lampert 2016", "title": "Extrapolation and learning equations", "venue": "arXiv preprint (ICLR 2017 submission, OpenReview BkgRp0FYe)", "url": "https://arxiv.org/abs/1610.02995"}}
  description: EQL formulas F-1..F-4 and division formula
  sources:
  - https://arxiv.org/abs/1610.02995
  - https://arxiv.org/e-print/1610.02995
  - https://arxiv.org/pdf/1610.02995v1
  - https://arxiv.org/abs/1806.07259
  - https://arxiv.org/e-print/1806.07259
  - https://arxiv.org/pdf/1806.07259v1
  - https://proceedings.mlr.press/v80/sahoo18a.html
  - https://proceedings.mlr.press/v80/sahoo18a/sahoo18a.pdf
  - https://github.com/martius-lab/EQL
  - https://github.com/martius-lab/EQL/blob/cd93824ccd330b814ddd334dd25e8b0fd5eb3f77/EQL-DIV-ICML/ICML-Datasets.ipynb
  - https://github.com/martius-lab/EQL/tree/cd93824ccd330b814ddd334dd25e8b0fd5eb3f77/EQL-DIV-ICML/data
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-154.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  F-1:
    raw: (1/3)*(sin(pi*x1) + sin(2*pi*x2 + pi/8) + x2 - x3*x4)
    prepared: v2/3 - v3*v4/3 + sin(3.141592653589793*v1)/3 + sin(2*3.141592653589793*v2 + 3.141592653589793/8)/3
    n_variables: 4
    subset: complex-formulas-interp
    vars:
      v1:
        name: x1
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v2:
        name: x2
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v3:
        name: x3
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v4:
        name: x4
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x1: uniform U[-1,1]
      x2: uniform U[-1,1]
      x3: uniform U[-1,1]
      x4: uniform U[-1,1]
    meta:
      finite_fraction: 1.0
  F-1.extrap-near:
