metadata:
  name: dso-benchmark-registry
  display_name: "dso-benchmark-registry*"
  version: 2
  benchmark: "dso-benchmark-registry"
  tags: {"origin": "classic benchmark", "tags": ["dummy inputs", "srbf-modified"]}
  license: "BSD-3-Clause (dso-org/deep-symbolic-optimization)"
  citation: {"paper": {"short": "Petersen et al. 2021", "title": "Deep symbolic regression: Recovering mathematical expressions from data via risk-seeking policy gradients", "venue": "ICLR 2021", "url": "https://arxiv.org/abs/1912.04871"}, "data": {"short": "GitHub dso-org/deep-symbolic-optimization@2069d4e", "title": "DSO benchmark registry benchmarks.csv (uDSR release 2069d4e, BSD-3-Clause)", "url": "https://github.com/dso-org/deep-symbolic-optimization/blob/2069d4eda47b0fd6d3e66e0ade9605cd9574b87c/dso/dso/task/regression/benchmarks.csv"}}
  srbf_changes: [{"kind": "part", "problems": 264, "text": "srbf runs here only the registry problems that no other srbf set covers (Nguyen-12a and Korns-13 to -15; Neat-6 is in the pinned-points set); the registry's other rows are run in the sets of their own benchmarks, apart from its two software sanity tests."}]
  srbf_notes: ["Follows the compilation's own code or data: Korns-15 uses the registry's own range [0, 50] on all inputs (benchmarks.csv); Korns (2011) uses [-50, 50], as srbf's Korns set does."]
  description: DSO benchmark registry (benchmarks.csv)
  sources:
  - https://github.com/dso-org/deep-symbolic-optimization/blob/master/dso/dso/task/regression/benchmarks.csv
  - https://raw.githubusercontent.com/dso-org/deep-symbolic-optimization/2069d4e/dso/dso/task/regression/benchmarks.csv
  - https://raw.githubusercontent.com/dso-org/deep-symbolic-optimization/a49c228/dso/dso/task/regression/benchmarks.csv
  - https://raw.githubusercontent.com/dso-org/deep-symbolic-optimization/57778611/dsr/dsr/task/regression/benchmarks.csv
  - https://github.com/dso-org/deep-symbolic-optimization/blob/2069d4e/dso/dso/functions.py
  - https://arxiv.org/abs/2111.00053
  - https://arxiv.org/e-print/2111.00053
  - https://arxiv.org/abs/1912.04871
  - https://doi.org/10.1016/j.ins.2015.11.010
  - https://www.cs.nuim.ie/~egalvan/papers/neat_Galvan_2016.pdf
  - https://doi.org/10.1007/3-540-36599-0_7
  - https://doi.org/10.1007/978-1-4614-1770-5_8
  - http://www.korns.com/Accuracy%20in%20Symbolic%20Regression.pdf
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  conventions:
    rules: 'srbf formula catalogs: the benchmark''s formulas, constants and input distributions; srbf draws the points (512
      to fit, 512 to test) and sets the noise; a value the authors draw anew for every run (a constant, an input''s range)
      is drawn with the points (the entry''s per_run block); srbf''s release freezes one draw per problem'
expressions:
  Nguyen-12a:
    subset: "dso-benchmark-registry"
    raw: x**4 - x**3 + y**2/2 - y
    prepared: v1**4 - v1**3 + v2**2/2 - v2
    n_variables: 2
    vars:
      v1:
        name: x
        sample_range:
        - 0.0
        - 10.0
        sample_type:
        - uni
        - pos
      v2:
        name: y
        sample_range:
        - 0.0
        - 10.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x: uniform U[0,10]
      y: uniform U[0,10]
    meta:
      finite_fraction: 1.0
  Korns-13:
    subset: "dso-benchmark-registry"
    raw: 32.0 - (3.0*((tan(x0)/tan(x1))*(tan(x2)/tan(x3))))
    prepared: -3.0*tan(v1)*tan(v3)/(tan(v2)*tan(v4)) + 32.0
    n_variables: 5
    vars:
      v1:
        name: x0
        sample_range:
        - -50.0
        - 50.0
        sample_type:
        - uni
        - pos
      v2:
        name: x1
        sample_range:
        - -50.0
        - 50.0
        sample_type:
        - uni
        - pos
      v3:
        name: x2
        sample_range:
        - -50.0
        - 50.0
        sample_type:
        - uni
        - pos
      v4:
        name: x3
        sample_range:
        - -50.0
        - 50.0
        sample_type:
        - uni
        - pos
      v5:
        name: x4
        sample_range:
        - -50.0
        - 50.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x0: 'uniform U[-50,50] (Korns 2011 Sec. 1.1: ''a training matrix is filled with pseudo random numbers between -50 and
        +50''; same rule for the testing matrix and for all five features)'
      x1: 'uniform U[-50,50] (Korns 2011 Sec. 1.1: ''a training matrix is filled with pseudo random numbers between -50 and
        +50''; same rule for the testing matrix and for all five features)'
      x2: 'uniform U[-50,50] (Korns 2011 Sec. 1.1: ''a training matrix is filled with pseudo random numbers between -50 and
        +50''; same rule for the testing matrix and for all five features)'
      x3: 'uniform U[-50,50] (Korns 2011 Sec. 1.1: ''a training matrix is filled with pseudo random numbers between -50 and
        +50''; same rule for the testing matrix and for all five features)'
      x4: 'uniform U[-50,50] (Korns 2011 Sec. 1.1: ''a training matrix is filled with pseudo random numbers between -50 and
        +50''; same rule for the testing matrix and for all five features)'
    meta:
      finite_fraction: 1.0
  Korns-14:
    subset: "dso-benchmark-registry"
    raw: 22.0 - (4.2*((cos(x0)-tan(x1))*(tanh(x2)/sin(x3))))
    prepared: -4.2*(cos(v1) - tan(v2))*tanh(v3)/sin(v4) + 22.0
    n_variables: 5
    vars:
      v1:
        name: x0
        sample_range:
        - -50.0
        - 50.0
        sample_type:
        - uni
        - pos
      v2:
        name: x1
        sample_range:
        - -50.0
        - 50.0
        sample_type:
        - uni
        - pos
      v3:
        name: x2
        sample_range:
        - -50.0
        - 50.0
        sample_type:
        - uni
        - pos
      v4:
        name: x3
        sample_range:
        - -50.0
        - 50.0
        sample_type:
        - uni
        - pos
      v5:
        name: x4
        sample_range:
        - -50.0
        - 50.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x0: 'uniform U[-50,50] (Korns 2011 Sec. 1.1: ''a training matrix is filled with pseudo random numbers between -50 and
        +50''; same rule for the testing matrix and for all five features)'
      x1: 'uniform U[-50,50] (Korns 2011 Sec. 1.1: ''a training matrix is filled with pseudo random numbers between -50 and
        +50''; same rule for the testing matrix and for all five features)'
      x2: 'uniform U[-50,50] (Korns 2011 Sec. 1.1: ''a training matrix is filled with pseudo random numbers between -50 and
        +50''; same rule for the testing matrix and for all five features)'
      x3: 'uniform U[-50,50] (Korns 2011 Sec. 1.1: ''a training matrix is filled with pseudo random numbers between -50 and
        +50''; same rule for the testing matrix and for all five features)'
      x4: 'uniform U[-50,50] (Korns 2011 Sec. 1.1: ''a training matrix is filled with pseudo random numbers between -50 and
        +50''; same rule for the testing matrix and for all five features)'
    meta:
      finite_fraction: 1.0
  Korns-15:
    subset: "dso-benchmark-registry"
    raw: 12.0 - (6.0*((tan(x0)/exp(x1))*(log(x2)-tan(x3))))
    prepared: -6.0*(log(v3) - tan(v4))*exp(-v2)*tan(v1) + 12.0
    n_variables: 5
    vars:
      v1:
        name: x0
        sample_range:
        - 0.0
        - 50.0
        sample_type:
        - uni
        - pos
      v2:
        name: x1
        sample_range:
        - 0.0
        - 50.0
        sample_type:
        - uni
        - pos
      v3:
        name: x2
        sample_range:
        - 0.0
        - 50.0
        sample_type:
        - uni
        - pos
      v4:
        name: x3
        sample_range:
        - 0.0
        - 50.0
        sample_type:
        - uni
        - pos
      v5:
        name: x4
        sample_range:
        - 0.0
        - 50.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x0: uniform U[0, 50] (the registry's own range; Korns 2011 uses [-50, 50])
      x1: uniform U[0, 50] (the registry's own range; Korns 2011 uses [-50, 50])
      x2: uniform U[0, 50] (the registry's own range; Korns 2011 uses [-50, 50])
      x3: uniform U[0, 50] (the registry's own range; Korns 2011 uses [-50, 50])
      x4: uniform U[0, 50] (the registry's own range; Korns 2011 uses [-50, 50])
    meta:
      finite_fraction: 1.0
