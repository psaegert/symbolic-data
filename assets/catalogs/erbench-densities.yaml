metadata:
  name: erbench-densities
  version: 2
  tags: {"origin": "science formula", "tags": ["extrapolation", "dummy inputs"]}
  srbf_changes: []
  citation: {"paper": {"short": "Kahlmeyer et al. 2026", "title": "ERBench: A Benchmark and Testsuite for Equation Discovery Algorithms", "venue": "arXiv preprint arXiv:2606.09276", "url": "https://arxiv.org/abs/2606.09276"}, "data": {"short": "Hugging Face EquationDiscovery/Equation_Recovery_Benchmark@95bf15c", "title": "ERBench Equation_Recovery_Benchmark (train.csv + reference generator)", "url": "https://huggingface.co/datasets/EquationDiscovery/Equation_Recovery_Benchmark/tree/95bf15c27de68c3f170ca6140d2e4a811c60344f"}}
  description: ERBench Densities family (33 entries after deduplication; headline eval tier); one problem per formula and
    alpha (ERBench's generator).
  sources:
  - ERBench (Kahlmeyer, Voigt, Habeck & Giesen, arXiv:2606.09276)
  - HuggingFace dataset EquationDiscovery/Equation_Recovery_Benchmark
  license: BSD-3-Clause (SciPy-derived, per ERBench README)
  eval_tier: headline
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  conventions:
    sampling: 'ERBench''s own generator (src/benchmark.py generate_problem / get_samples; srbf ruling 2026-11-03): one problem
      per formula and alpha in {0, 0.5, 1}; every variable a fresh 1-3 part mixture (uniform sub-interval or normal with sigma
      = distance to the nearer edge / 3; integers: uniform-integer or binomial), clipped to the support; fitting rows in the
      window [a1, a1 + (b - a)/2], a1 = a + alpha (b - a)/2; test rows on the rest of the support, split by length; 0 or 1
      dummy column per problem (drawn once, seeded), its values drawn from the point set''s own values. srbf sets the number
      of points and the noise (ruling 4); invalid rows are redrawn (per-point rejection) where ERBench resamples invalid targets.'
    canonicalization: '''^''->''**'', ''Abs(''->''abs('', log(u,10)->log10-rewrite, x_k->v{k+1}; exact duplicates (expression+support+dtype)
      merged with names in meta.duplicate_of_rows.'
