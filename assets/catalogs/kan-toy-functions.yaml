  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-66.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  kan-1:
    raw: besselj(0, 20*x)
    prepared: besselj(0, 20*v1)
    n_variables: 1
    subset: all
    vars:
      v1:
        name: x
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x: U[-1,1]
    needs_simplipy: '0.15'
  kan-2:
    raw: exp(sin(pi*x) + y**2)
    prepared: exp(v2**2 + sin(3.141592653589793*v1))
    n_variables: 2
    subset: all
    vars:
      v1:
        name: x
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v2:
        name: y
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x: U[-1,1]
      y: U[-1,1]
    meta:
      finite_fraction: 1.0
  kan-3:
    raw: x*y
    prepared: v1*v2
    n_variables: 2
    subset: all
    vars:
      v1:
        name: x
        sample_range:
        - -1.0
