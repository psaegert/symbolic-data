expressions:
  train_nc-000:
    raw: sin(x_1)/x_1**2
    prepared: sin(v1)/v1**2
    n_variables: 1
    subset: all
    vars:
      v1:
        name: x_1
        sample_range:
        - -10.0
        - 10.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x_1: U[-10,10]
    test:
      vars:
        v1:
          dist:
            name: uniform
            kwargs:
              low: -25.0
              high: 25.0
    test_source: 'NSRwH (Bendinelli, Biggio & Kamienny 2023, arXiv:2304.10336) App. C.2 as quoted in sets/fresh-75..78.json:
      ''For the other datasets, to test the quality of our prediction, we sampled 500 points from the OOD support U(-25,25)'';
      code data.py get_robust_random_data l.1183-1230 @ 3060cb8 (500 points, Uniform(-25,25), NaN and |y| >= 65504 rejected).
      Training support U[-10,10] from the csv support column'
    meta:
      finite_fraction: 1.0
