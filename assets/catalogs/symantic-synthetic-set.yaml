metadata:
  name: symantic-synthetic-set
  version: 1
  tags: {"origin": "classic benchmark", "tags": ["dummy inputs"]}
  description: SyMANTIC synthetic set
  sources:
  - https://arxiv.org/abs/2502.03367v1
  - https://arxiv.org/pdf/2502.03367v1
  - https://arxiv.org/e-print/2502.03367
  - https://doi.org/10.1021/acs.iecr.4c03503
  - https://github.com/PaulsonLab/SyMANTIC/tree/3f4c83465657a989f206bba65989cfc1c447dd28
  - https://raw.githubusercontent.com/PaulsonLab/SyMANTIC/3f4c83465657a989f206bba65989cfc1c447dd28/examples/SyMANTIC_Examples%20(1).ipynb
  - https://raw.githubusercontent.com/MilesCranmer/PySR/master/README.md
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-113.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  Synthetic_1:
    raw: 10*(x1/(x2*(x3 + x4))) + 2.5
    prepared: 10*v1/(v2*(v3 + v4)) + 2.5
    n_variables: 5
    subset: all
    vars:
      v1:
        name: x1
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v2:
        name: x2
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v3:
        name: x3
        sample_range:
