        - uni
        - pos
      v4:
        name: x4
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v5:
        name: x5
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x1: U[1,5]
      x2: U[1,5]
      x3: U[1,5]
      x4: U[1,5]
      x5: U[1,5]
    meta:
      finite_fraction: 1.0
