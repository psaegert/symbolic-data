metadata:
  name: eql-cart-pendulum
  version: 1
  tags: {"origin": "science formula", "tags": ["extrapolation", "several tests", "dummy inputs"]}
  description: EQL cart-pendulum
  sources:
  - https://proceedings.mlr.press/v80/sahoo18a.html
  - https://proceedings.mlr.press/v80/sahoo18a/sahoo18a.pdf
  - https://arxiv.org/abs/1806.07259v1
  - https://arxiv.org/e-print/1806.07259v1
  - https://github.com/martius-lab/EQL/tree/28521aed7a213299a52982430b2b83917fadae20/EQL-DIV-ICML
  - https://github.com/martius-lab/EQL/blob/28521aed7a213299a52982430b2b83917fadae20/EQL-DIV-ICML/ICML-Datasets.ipynb
  - https://github.com/martius-lab/EQL/blob/28521aed7a213299a52982430b2b83917fadae20/EQL-DIV-ICML/src/utils.py
  - https://github.com/martius-lab/EQL/tree/28521aed7a213299a52982430b2b83917fadae20/EQL-DIV-ICML/data
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-157.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  eql-cartpendulum-y1:
    raw: x3
    prepared: v3
    n_variables: 4
    subset: interp
    vars:
      v1:
        name: x1
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v2:
        name: x2
        sample_range:
        - -1.5707963267948966
        - 1.5707963267948966
        sample_type:
        - uni
        - pos
      v3:
        name: x3
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v4:
        name: x4
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x1: uniform U[-1, 1]
      x2: uniform U[-pi/2, pi/2]
      x3: uniform U[-1, 1]
      x4: uniform U[-1, 1]
    meta:
      finite_fraction: 1.0
  eql-cartpendulum-y1.extrap:
    raw: x3
    prepared: v3
    n_variables: 4
    subset: extrap
    vars:
      v1:
        name: x1
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v2:
        name: x2
        sample_range:
        - -1.5707963267948966
        - 1.5707963267948966
        sample_type:
        - uni
        - pos
      v3:
        name: x3
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v4:
        name: x4
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x1: uniform U[-1, 1]
      x2: uniform U[-pi/2, pi/2]
      x3: uniform U[-1, 1]
      x4: uniform U[-1, 1]
    test:
      vars:
        v1:
          dist:
            name: uniform
            kwargs:
              low: -2.0
              high: 2.0
        v2:
          dist:
            name: uniform
            kwargs:
              low: -3.141592653589793
              high: 3.141592653589793
        v3:
          dist:
            name: uniform
            kwargs:
              low: -2.0
              high: 2.0
        v4:
          dist:
            name: uniform
            kwargs:
              low: -2.0
              high: 2.0
      row_constraints:
      - maximum.reduce([abs(v1), abs(v2) / 1.5707963267948966, abs(v3), abs(v4)]) > 1.0
    test_source: 'Sahoo, Lampert & Martius 2018, arXiv:1806.07259v1, 4arxiv.tex (raw/fresh-157/arXiv1806.07259v1_source.tar.gz,
      opened) l.735: ''For testing, we have two sets, one from the training domain and one from an extrapolation domain, for
      instance [-2,2]^n \ [-1,1]^n''; l.745-751 (division task): ''we sample 10000 points uniformly in the hypercube [-1,1]^2
      ... The extrapolation test set contains 5000 uniformly'
    meta:
      finite_fraction: 1.0
