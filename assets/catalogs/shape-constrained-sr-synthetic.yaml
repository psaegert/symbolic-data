metadata:
  name: shape-constrained-sr-synthetic
  version: 1
  tags: {"origin": "science formula", "tags": []}
  description: Shape-constrained SR synthetic (FDE + FEY)
  sources:
  - https://arxiv.org/abs/2103.15624
  - https://doi.org/10.1162/evco_a_00294
  - https://arxiv.org/abs/1706.02281
  - https://doi.org/10.1016/j.eswa.2018.05.021
  - https://github.com/heal-research/HeuristicLab/blob/c57538bf4bf4e944e75bcac0468c33ec5a27d4bf/HeuristicLab.Problems.Instances.DataAnalysis/3.3/Regression/Physics/AircraftLift.cs
  - https://github.com/heal-research/HeuristicLab/blob/c57538bf4bf4e944e75bcac0468c33ec5a27d4bf/HeuristicLab.Problems.Instances.DataAnalysis/3.3/Regression/Physics/FluidDynamics.cs
  - https://github.com/heal-research/HeuristicLab/blob/c57538bf4bf4e944e75bcac0468c33ec5a27d4bf/HeuristicLab.Problems.Instances.DataAnalysis/3.3/Regression/Physics/RocketFuelFlow.cs
  - https://github.com/heal-research/HeuristicLab/blob/c57538bf4bf4e944e75bcac0468c33ec5a27d4bf/HeuristicLab.Problems.Instances.DataAnalysis/3.3/Regression/Feynman/Feynman31.cs
  - https://github.com/heal-research/HeuristicLab/blob/c57538bf4bf4e944e75bcac0468c33ec5a27d4bf/HeuristicLab.Problems.Instances.DataAnalysis/3.3/Regression/Feynman/Feynman44.cs
  - https://github.com/heal-research/HeuristicLab/blob/c57538bf4bf4e944e75bcac0468c33ec5a27d4bf/HeuristicLab.Problems.Instances.DataAnalysis/3.3/Regression/Feynman/Feynman50.cs
  - https://github.com/heal-research/HeuristicLab/blob/c57538bf4bf4e944e75bcac0468c33ec5a27d4bf/HeuristicLab.Problems.Instances.DataAnalysis/3.3/Regression/Feynman/Feynman90.cs
  - https://github.com/heal-research/HeuristicLab/commit/50af0024d0
  - https://dev.heuristiclab.com/trac.fcgi/ticket/3014
  - https://github.com/folivetti/ITEA/blob/9edf15755ab2d7ff649be54e8facb5527f3d2bc7/configs/aircraft_lift_0.cfg
  - https://github.com/folivetti/ITEA/blob/9edf15755ab2d7ff649be54e8facb5527f3d2bc7/configs/flow_psi_0.cfg
  - https://arxiv.org/abs/2107.09458
  - https://space.mit.edu~/aifeynman.html
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-49.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  Aircraft lift:
    raw: C_La*(alpha + 2) + C_Lde*delta_e*S_HT/S_ref
    prepared: v1*(v2 + 2) + v3*v4*v5/v6
    n_variables: 6
    subset: all
    vars:
      v1:
        name: C_La
        sample_range:
        - 0.4
        - 0.8
        sample_type:
        - uni
        - pos
      v2:
        name: alpha
        sample_range:
        - 5.0
        - 10.0
        sample_type:
        - uni
        - pos
      v3:
        name: C_Lde
        sample_range:
        - 0.4
        - 0.8
        sample_type:
        - uni
        - pos
      v4:
        name: delta_e
        sample_range:
        - 5.0
        - 10.0
        sample_type:
        - uni
        - pos
      v5:
        name: S_HT
        sample_range:
        - 1.0
        - 1.5
        sample_type:
        - uni
        - pos
      v6:
        name: S_ref
        sample_range:
        - 5.0
        - 7.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      C_La: uniform U[0.4,0.8]
      alpha: uniform U[5,10] (degrees)
      C_Lde: uniform U[0.4,0.8]
      delta_e: uniform U[5,10] (degrees)
      S_HT: uniform U[1,1.5] (m^2)
      S_ref: uniform U[5,7] (m^2)
    meta:
      finite_fraction: 1.0
  Flow psi:
    raw: V_inf*r*sin(pi*theta/180)*(1 - (R/r)**2) + Gamma/(2*pi)*log(r/R)
    prepared: v1*v3*(1 - v4**2/v3**2)*sin(3.141592653589793*v2/180) + (1/(2*3.141592653589793))*v5*log(v3/v4)
    n_variables: 5
    subset: all
    vars:
      v1:
        name: V_inf
        sample_range:
        - 60.0
        - 65.0
        sample_type:
        - uni
        - pos
      v2:
        name: theta
        sample_range:
        - 30.0
        - 40.0
        sample_type:
        - uni
        - pos
      v3:
        name: r
        sample_range:
        - 0.5
        - 0.8
        sample_type:
        - uni
        - pos
      v4:
        name: R
        sample_range:
        - 0.2
        - 0.5
        sample_type:
        - uni
        - pos
      v5:
        name: Gamma
        sample_range:
        - 5.0
        - 10.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      V_inf: uniform U[60,65] (m/s)
      theta: uniform U[30,40] (degrees)
      r: uniform U[0.5,0.8] (m)
      R: uniform U[0.2,0.5] (m)
      Gamma: uniform U[5,10] (m^2/s)
    meta:
      finite_fraction: 1.0
  Fuel flow:
    raw: p0*A_star/sqrt(T0)*sqrt(1.4/287*(2/(1 + 1.4))**((1.4 + 1)/(1.4 - 1)))
    prepared: v1*v2*(0.0698430295769578*(2/(1 + 1.4))**((1 + 1.4)/(2*(1.4 - 1*1))))/sqrt(v3)
    n_variables: 3
    subset: all
    vars:
      v1:
        name: p0
        sample_range:
        - 400000.0
        - 600000.0
        sample_type:
        - uni
        - pos
      v2:
        name: A_star
        sample_range:
        - 0.5
        - 1.5
        sample_type:
        - uni
        - pos
      v3:
        name: T0
        sample_range:
        - 250.0
        - 260.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      p0: uniform U[4e5,6e5] (Pa)
      A_star: uniform U[0.5,1.5] (m^2)
      T0: uniform U[250,260] (K)
    meta:
      finite_fraction: 1.0
  I.41.16:
    raw: h*omega**3/(pi**2*c**2*(exp(h*omega/(kb*T)) - 1))
    prepared: v1**3*v3/(3.141592653589793**2*v5**2*(exp(v1*v3/(v2*v4)) - 1))
    n_variables: 5
    subset: all
    vars:
      v1:
        name: omega
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v2:
        name: T
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v3:
        name: h
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v4:
        name: kb
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v5:
        name: c
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      omega: uniform U[1,5]
      T: uniform U[1,5]
      h: uniform U[1,5]
      kb: uniform U[1,5]
      c: uniform U[1,5]
    meta:
      finite_fraction: 1.0
  III.9.52:
    raw: p_d*Ef*t/h*sin((omega - omega_0)*t/2)**2/((omega - omega_0)*t/2)**2
    prepared: 4*v1*v2*sin(v3*(v5 - v6)/2)**2/(v3*v4*(v5 - v6)**2)
    n_variables: 6
    subset: all
    vars:
      v1:
        name: p_d
        sample_range:
        - 1.0
        - 3.0
        sample_type:
        - uni
        - pos
      v2:
        name: Ef
        sample_range:
        - 1.0
        - 3.0
        sample_type:
        - uni
        - pos
      v3:
        name: t
        sample_range:
        - 1.0
        - 3.0
        sample_type:
        - uni
        - pos
      v4:
        name: h
        sample_range:
        - 1.0
        - 3.0
        sample_type:
        - uni
        - pos
      v5:
        name: omega
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v6:
        name: omega_0
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      p_d: uniform U[1,3]
      Ef: uniform U[1,3]
      t: uniform U[1,3]
      h: uniform U[1,3]
      omega: uniform U[1,5]
      omega_0: uniform U[1,5]
    meta:
      finite_fraction: 1.0
  I.30.5:
    raw: asin(lambd/(n*d))
    prepared: asin(v1/(v2*v3))
    n_variables: 3
    subset: all
    vars:
      v1:
        name: lambd
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v2:
        name: d
        sample_range:
        - 2.0
        - 5.0
        sample_type:
        - uni
        - pos
      v3:
        name: n
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      lambd: uniform U[1,5] (as printed in Table 6)
      d: uniform U[2,5]
      n: uniform U[1,5]
    meta:
      finite_fraction: 0.9645
  I.48.20:
    raw: m*c**2/sqrt(1 - v**2/c**2)
    prepared: v1*v3**2/sqrt(-v2**2/v3**2 + 1)
    n_variables: 3
    subset: all
    vars:
      v1:
        name: m
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v2:
        name: v
        sample_range:
        - 1.0
        - 2.0
        sample_type:
        - uni
        - pos
      v3:
        name: c
        sample_range:
        - 3.0
        - 20.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      m: uniform U[1,5]
      v: uniform U[1,2]
      c: uniform U[3,20] (as printed in Table 6)
    meta:
      finite_fraction: 1.0
