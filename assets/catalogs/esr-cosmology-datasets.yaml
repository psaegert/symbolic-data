  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-53.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  lcdm-mock-cc:
    raw: 67.4*sqrt(0.315*x**3 + 1 - 0.315)
    prepared: 1430.9694*v1**3 + 3111.7906
    n_variables: 1
    subset: mock
    vars:
      v1:
        name: x
        sample_range:
        - 1.07
        - 3.0
        sample_type:
        - log
        - pos
      v0:
        name: y
    input_distributions:
      x: log-uniform on [1.07, 3.0] (x = 1 + z; z = 10**U[log10(1.07), log10(3)] - 1)
    target: the authors fit 4542.76*(0.315*x**3 + 1 - 0.315), not the published law itself
    meta:
      finite_fraction: 1.0
