metadata:
  name: erbench-public-legacy-formulas
  display_name: "erbench-public-legacy-formulas*"
  version: 2
  benchmark: "erbench"
  tags: {"origin": "classic benchmark", "tags": ["srbf-modified"]}
  license: "facts only: formulas and ranges cited from the original family authors (Korns 2011; Uy et al. 2011; Udrescu et al. 2020; DSO benchmarks.csv, BSD-3-Clause); ERBench ids for mapping only"
  citation: {"paper": {"short": "Kahlmeyer et al. 2026", "title": "ERBench: A Benchmark and Testsuite for Equation Discovery Algorithms", "venue": "arXiv preprint arXiv:2606.09276", "url": "https://arxiv.org/abs/2606.09276"}, "data": {"short": "Hugging Face EquationDiscovery/Equation_Recovery_Benchmark@95bf15c", "title": "ERBench Equation_Recovery_Benchmark (train.csv + reference generator)", "url": "https://huggingface.co/datasets/EquationDiscovery/Equation_Recovery_Benchmark/tree/95bf15c27de68c3f170ca6140d2e4a811c60344f"}}
  srbf_changes: [{"kind": "part", "problems": 601, "text": "srbf runs 5 of ERBench's 606 legacy rows here: most rows are run in the sets of the benchmarks they come from (Feynman, Korns, Nguyen, ...), 13 AI Feynman 2.0 rows have no input range from their authors, and the 14 Strogatz rows are differential-equation tasks."}, {"kind": "changed", "problems": 5, "text": "srbf samples these problems uniformly over the original authors' input ranges, not with ERBench's own generator (fitting window, extrapolation test, random extra input) that it uses for the other ERBench sets."}, {"kind": "filled", "problems": 1, "text": "For AI Feynman 2.0 equation 12 the authors state the range [-1, 1] but not how inputs are spread over it; srbf samples them uniformly."}]
  srbf_notes: ["Follows the compilation's own code or data: Korns-13 to -15 are ERBench's renderings on 4 inputs (Korns' unused fifth input dropped); Korns (2011) fills five inputs on [-50, 50].", "Follows the compilation's own code or data: Korns-15 and AI Feynman 2.0's equation 12 use ERBench's narrowed boxes ('supports altered afterwards to yield valid values'); Korns (2011) uses [-50, 50] and AI Feynman 2.0 states [-1, 1].", "Follows the compilation's own code or data: Nguyen-9 is Uy et al.'s F9 on [-1, 1]^2 in both."]
  description: 'ERBench public: legacy formulas'
  sources:
  - https://arxiv.org/abs/2606.09276
  - https://huggingface.co/datasets/EquationDiscovery/Equation_Recovery_Benchmark/resolve/95bf15c27de68c3f170ca6140d2e4a811c60344f/train.csv
  - https://arxiv.org/abs/2006.10782
  - https://arxiv.org/e-print/2006.10782v2
  - https://arxiv.org/pdf/2006.10782v2
  - https://arxiv.org/e-print/1905.11481
  - https://github.com/SJ001/AI-Feynman
  - https://doi.org/10.1007/978-1-4614-1770-5_8
  - http://www.korns.com/Accuracy%20in%20Symbolic%20Regression.pdf
  - https://doi.org/10.1007/s10710-010-9121-2
  - https://mural.maynoothuniversity.ie/id/eprint/12336/1/Galvan_Semantically_2011.pdf
  - https://github.com/dso-org/deep-symbolic-optimization/blob/a49c22858b3cd81683803f6898e0725943934494/dso/dso/task/regression/benchmarks.csv
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  conventions:
    rules: 'srbf formula catalogs: the benchmark''s formulas, constants and input distributions; srbf draws the points (512
      to fit, 512 to test) and sets the noise; a value the authors draw anew for every run (a constant, an input''s range)
      is drawn with the points (the entry''s per_run block); srbf''s release freezes one draw per problem'
expressions:
  AIF2-table4-eq12:
    subset: "legacy"
    raw: x_0*x_1*x_2 - x_2*sqrt(1 - x_0**2)*sqrt(1-x_1**2)- x_1*sqrt(1 - x_0**2)*sqrt(1-x_2**2) - x_0*sqrt(1 - x_1**2)*sqrt(1-x_2**2)
    prepared: v1*v2*v3 - v1*sqrt(1 - v2**2)*sqrt(1 - v3**2) - v2*sqrt(1 - v1**2)*sqrt(1 - v3**2) - v3*sqrt(1 - v1**2)*sqrt(1
      - v2**2)
    n_variables: 3
    vars:
      v1:
        name: x_0
        sample_range:
        - 0.9327809291515141
        - 0.9952809291515141
        sample_type:
        - uni
        - pos
      v2:
        name: x_1
        sample_range:
        - -0.6901104506009879
        - -0.6276104506009879
        sample_type:
        - uni
        - pos
      v3:
        name: x_2
        sample_range:
        - 0.8038061536253802
        - 0.8663061536253802
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x_0: uniform U[0.9327809291515141, 0.9952809291515141] (the compilation's own box)
      x_1: uniform U[-0.6901104506009879, -0.6276104506009879] (the compilation's own box)
      x_2: uniform U[0.8038061536253802, 0.8663061536253802] (the compilation's own box)
    meta:
      finite_fraction: 1.0
  Korns-13:
    subset: "legacy"
    raw: -3*tan(x_0)*tan(x_1)/(tan(x_2)*tan(x_3)) + 32
    prepared: -3*tan(v1)*tan(v2)/(tan(v3)*tan(v4)) + 32
    n_variables: 4
    vars:
      v1:
        name: x_0
        sample_range:
        - -50.0
        - 50.0
        sample_type:
        - uni
        - pos
      v2:
        name: x_1
        sample_range:
        - -50.0
        - 50.0
        sample_type:
        - uni
        - pos
      v3:
        name: x_2
        sample_range:
        - -50.0
        - 50.0
        sample_type:
        - uni
        - pos
      v4:
        name: x_3
        sample_range:
        - -50.0
        - 50.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x_0: uniform U[-50.0, 50.0] (the compilation's own box)
      x_1: uniform U[-50.0, 50.0] (the compilation's own box)
      x_2: uniform U[-50.0, 50.0] (the compilation's own box)
      x_3: uniform U[-50.0, 50.0] (the compilation's own box)
    meta:
      finite_fraction: 1.0
  Korns-14:
    subset: "legacy"
    raw: -(4.2*cos(x_0) - 4.2*tan(x_1))*tanh(x_2)/sin(x_3) + 22
    prepared: (-4.2*cos(v1) + 4.2*tan(v2))*tanh(v3)/sin(v4) + 22
    n_variables: 4
    vars:
      v1:
        name: x_0
        sample_range:
        - -50.0
        - 50.0
        sample_type:
        - uni
        - pos
      v2:
        name: x_1
        sample_range:
        - -50.0
        - 50.0
        sample_type:
        - uni
        - pos
      v3:
        name: x_2
        sample_range:
        - -50.0
        - 50.0
        sample_type:
        - uni
        - pos
      v4:
        name: x_3
        sample_range:
        - -50.0
        - 50.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x_0: uniform U[-50.0, 50.0] (the compilation's own box)
      x_1: uniform U[-50.0, 50.0] (the compilation's own box)
      x_2: uniform U[-50.0, 50.0] (the compilation's own box)
      x_3: uniform U[-50.0, 50.0] (the compilation's own box)
    meta:
      finite_fraction: 1.0
  Korns-15:
    subset: "legacy"
    raw: -6*(log(x_2) - tan(x_3))*exp(-x_1)*tan(x_0) + 12
    prepared: -6*(log(v3) - tan(v4))*exp(-v2)*tan(v1) + 12
    n_variables: 4
    vars:
      v1:
        name: x_0
        sample_range:
        - 0.24818997227908168
        - 1.2481899722790817
        sample_type:
        - uni
        - pos
      v2:
        name: x_1
        sample_range:
        - -1.5831774122820366
        - -0.5831774122820366
        sample_type:
        - uni
        - pos
      v3:
        name: x_2
        sample_range:
        - 0.5479474173492189
        - 1.547947417349219
        sample_type:
        - uni
        - pos
      v4:
        name: x_3
        sample_range:
        - -0.5746221189112442
        - 0.42537788108875585
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x_0: uniform U[0.24818997227908168, 1.2481899722790817] (the compilation's own box)
      x_1: uniform U[-1.5831774122820366, -0.5831774122820366] (the compilation's own box)
      x_2: uniform U[0.5479474173492189, 1.547947417349219] (the compilation's own box)
      x_3: uniform U[-0.5746221189112442, 0.42537788108875585] (the compilation's own box)
    meta:
      finite_fraction: 1.0
  Uy2011-F9:
    subset: "legacy"
    raw: sin(x) + sin(y**2)
    prepared: sin(v1) + sin(v2**2)
    n_variables: 2
    vars:
      v1:
        name: x
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v2:
        name: y
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x: 'random in [-1,1] (Table 3 ''Fitcases'': ''100 random points ⊆ [-1,1] x [-1,1]''); the sampling law is not named
        (uniform is the plain reading)'
      y: 'random in [-1,1] (Table 3 ''Fitcases'': ''100 random points ⊆ [-1,1] x [-1,1]''); the sampling law is not named
        (uniform is the plain reading)'
    meta:
      finite_fraction: 1.0
