metadata:
  name: physo-class
  version: 2
  tags: {"origin": "science formula", "tags": []}
  srbf_changes: [{"kind": "changed", "problems": 8, "text": "Class SR asks for one formula shared by several datasets whose constants differ; srbf runs each law as a single dataset."}]
  license: "MIT (WassimTenachi/PhySO)"
  citation: {"paper": {"short": "Tenachi et al. 2024", "title": "Class Symbolic Regression: Gotta Fit ’Em All", "venue": "The Astrophysical Journal Letters 969(2):L26", "url": "https://doi.org/10.3847/2041-8213/ad5970"}, "data": {"short": "GitHub WassimTenachi/PhySO@bfbfa88", "title": "PhySO ClassEquations.csv (MIT)", "url": "https://github.com/WassimTenachi/PhySO/blob/bfbfa88d5def09d3d0cd47f3e2252b5a25836721/physo/benchmark/ClassDataset/ClassEquations.csv"}}
  description: PhySO Class SR benchmark
  sources:
  - https://arxiv.org/abs/2312.01816
  - https://arxiv.org/html/2312.01816v2
  - https://doi.org/10.3847/2041-8213/ad5970
  - https://github.com/WassimTenachi/PhySO/blob/v1.1.0/physo/benchmark/ClassDataset/ClassEquations.csv
  - https://github.com/WassimTenachi/PhySO/blob/v1.1.0/physo/benchmark/ClassDataset/ClassProblem.py
  - https://github.com/WassimTenachi/PhySO/blob/v1.1.0/benchmarking/ClassBenchmark/classbench_config.py
  - https://github.com/WassimTenachi/PhySO/blob/v1.1.0/benchmarking/ClassBenchmark/classbench_run.py
  - https://github.com/WassimTenachi/PhySO/blob/v1.1.0/benchmarking/ClassBenchmark/results/results_summary.csv
  - https://doi.org/10.5281/zenodo.11663147
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-56.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  harmonic-oscillator:
    raw: A*cos(omega*t+Phi)
    prepared: 0.6307235436992683*cos(1.4522688010225138*v1 + 1.102213949606074)
    n_variables: 1
    subset: all
    vars:
      v1:
        name: t
        sample_range:
        - 0.0
        - 9.42
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      t: uniform U[0,9.42]
    per_run:
      params:
        A:
          sample_range:
          - 0.6
          - 1.2
          sample_type:
          - uni
          - pos
        Phi:
          sample_range:
          - 0.95
          - 1.15
          sample_type:
          - uni
          - pos
        omega:
          sample_range:
          - 0.2
          - 1.5
          sample_type:
          - uni
          - pos
      prepared: A*cos(Phi + omega*v1)
    meta:
      finite_fraction: 1.0
  radioactive-decay:
    raw: n0*exp(-t/T)
    prepared: 0.49254870192903333*exp(-0.7748183910216704*v1)
    n_variables: 1
    subset: all
    vars:
      v1:
        name: t
        sample_range:
        - 0.5
        - 6.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      t: uniform U[0.5,6]
    per_run:
      params:
        T:
          sample_range:
          - 0.9
          - 1.4
          sample_type:
          - uni
          - pos
        n0:
          sample_range:
          - 0.4
          - 2.0
          sample_type:
          - uni
          - pos
      prepared: n0*exp(-v1/T)
    meta:
      finite_fraction: 1.0
  free-fall:
    raw: -0.5*9.81*t**2+v0*t+z0
    prepared: -4.905*v1**2 + 5.9003468064243085*v1 - 0.31209009699183454
    n_variables: 1
    subset: all
    vars:
      v1:
        name: t
        sample_range:
        - 0.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      t: uniform U[0,1]
    per_run:
      params:
        c_v0:
          sample_range:
          - -2.0
          - 8.0
          sample_type:
          - uni
          - pos
        z0:
          sample_range:
          - -3.0
          - 3.0
          sample_type:
          - uni
          - pos
      prepared: c_v0*v1 - 4.905*v1**2 + z0
    meta:
      finite_fraction: 1.0
  damped-harmonic-oscillator-a:
    raw: exp(-k*t)*cos(1.389*t+Phi)
    prepared: exp(-0.5401911000932795*v1)*cos(1.389*v1 + 0.0009169132637459887)
    n_variables: 1
    subset: all
    vars:
      v1:
        name: t
        sample_range:
        - 0.0
        - 9.42
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      t: uniform U[0,9.42]
    per_run:
      params:
        Phi:
          sample_range:
          - -0.2
          - 0.3
          sample_type:
          - uni
          - pos
        k:
          sample_range:
          - 0.2
          - 1.0
          sample_type:
          - uni
          - pos
      prepared: exp(-k*v1)*cos(Phi + 1.389*v1)
    meta:
      finite_fraction: 1.0
  damped-harmonic-oscillator-b:
    raw: exp(-0.345*t)*cos(omega*t+Phi)
    prepared: exp(-0.345*v1)*cos(1.2615497638551996*v1 - 0.11270430564176293)
    n_variables: 1
    subset: all
    vars:
      v1:
        name: t
        sample_range:
        - 0.0
        - 9.42
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      t: uniform U[0,9.42]
    per_run:
      params:
        Phi:
          sample_range:
          - -0.2
          - 0.3
          sample_type:
          - uni
          - pos
        omega:
          sample_range:
          - 0.6
          - 1.4
          sample_type:
          - uni
          - pos
      prepared: exp(-0.345*v1)*cos(Phi + omega*v1)
    meta:
      finite_fraction: 1.0
  black-body-photon-count:
    raw: 1/(exp(5.90*nu/T)-1)
    prepared: 1/(exp(1.441993548245382*v1) - 1)
    n_variables: 1
    subset: all
    vars:
      v1:
        name: nu
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      nu: uniform U[1,5]
    per_run:
      params:
        T:
          sample_range:
          - 1.0
          - 5.0
          sample_type:
          - uni
          - pos
      prepared: 1/(exp(5.9*v1/T) - 1)
    meta:
      finite_fraction: 1.0
  ideal-gas-law:
    raw: n*8.314*T/V
    prepared: 14.022087345445505*v1/v2
    n_variables: 2
    subset: all
    vars:
      v1:
        name: T
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v2:
        name: V
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      T: uniform U[1,5]
      V: uniform U[1,5]
    per_run:
      params:
        n:
          sample_range:
          - 1.0
          - 5.0
          sample_type:
          - uni
          - pos
      prepared: 8.314*n*v1/v2
    meta:
      finite_fraction: 1.0
  terminal-velocity:
    raw: sqrt(2*m*9.807/(rho*A*0.470))
    prepared: 3.2445784315470982*sqrt(v1/v2)
    n_variables: 2
    subset: all
    vars:
      v1:
        name: m
        sample_range:
        - 1.0
        - 10.0
        sample_type:
        - uni
        - pos
      v2:
        name: A
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      m: uniform U[1,10]
      A: uniform U[1,5]
    per_run:
      params:
        rho:
          sample_range:
          - 1.0
          - 6.0
          sample_type:
          - uni
          - pos
      prepared: 6.460024372525*sqrt(v1/(rho*v2))
    meta:
      finite_fraction: 1.0
