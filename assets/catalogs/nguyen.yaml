metadata:
  name: nguyen
  version: 2
  tags: {"origin": "classic benchmark", "tags": []}
  srbf_changes: [{"kind": "changed", "problems": 2, "text": "Nguyen-11 and Nguyen-12 are not in Uy et al. (2011), which defines Nguyen-1 to -10; srbf keeps them as later benchmark lists define them, and tests Nguyen-11 on the grid Keijzer (2003) uses for the same formula."}]
  license: "BSD-3-Clause (dso-org/deep-symbolic-optimization benchmarks.csv); formulas and ranges as in each benchmark's first publication (facts)"
  citation: {"paper": {"short": "Uy et al. 2011", "title": "Semantically-based crossover in genetic programming: application to real-valued symbolic regression", "venue": "Genetic Programming and Evolvable Machines 12(2):91-119", "url": "https://doi.org/10.1007/s10710-010-9121-2"}, "data": {"short": "GitHub dso-org/deep-symbolic-optimization@2069d4e", "title": "DSO benchmark registry benchmarks.csv (uDSR release 2069d4e, BSD-3-Clause)", "url": "https://github.com/dso-org/deep-symbolic-optimization/blob/2069d4eda47b0fd6d3e66e0ade9605cd9574b87c/dso/dso/task/regression/benchmarks.csv"}}
  description: Nguyen symbolic-regression suite (Uy et al. 2011), 12 equations.
  sources:
  - Nguyen benchmark (Uy et al. 2011)
  - formulas + ranges from dso-org/deep-symbolic-optimization benchmarks.csv (Petersen
    et al. 2021)
  sampling_defaults:
    n_points: 20
    method: random
    noise: 0.0
  source_kind: set
  conventions:
    sampling: vars use the `fastsrb` distribution (sample_range/sample_type).
expressions:
  Nguyen-1:
    raw: x1 ** 3 + x1 ** 2 + x1
    prepared: v1 ** 3 + v1 ** 2 + v1
    n_variables: 1
    sources:
    - Nguyen benchmark (Uy et al. 2011)
    - formulas + ranges from dso-org/deep-symbolic-optimization benchmarks.csv (Petersen
      et al. 2021)
    vars:
      v1:
        name: x1
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
  Nguyen-2:
    raw: x1 ** 4 + x1 ** 3 + x1 ** 2 + x1
    prepared: v1 ** 4 + v1 ** 3 + v1 ** 2 + v1
    n_variables: 1
    sources:
    - Nguyen benchmark (Uy et al. 2011)
    - formulas + ranges from dso-org/deep-symbolic-optimization benchmarks.csv (Petersen
      et al. 2021)
    vars:
      v1:
        name: x1
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
  Nguyen-3:
    raw: x1 ** 5 + x1 ** 4 + x1 ** 3 + x1 ** 2 + x1
    prepared: v1 ** 5 + v1 ** 4 + v1 ** 3 + v1 ** 2 + v1
    n_variables: 1
    sources:
    - Nguyen benchmark (Uy et al. 2011)
    - formulas + ranges from dso-org/deep-symbolic-optimization benchmarks.csv (Petersen
      et al. 2021)
    vars:
      v1:
        name: x1
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
  Nguyen-4:
    raw: x1 ** 6 + x1 ** 5 + x1 ** 4 + x1 ** 3 + x1 ** 2 + x1
    prepared: v1 ** 6 + v1 ** 5 + v1 ** 4 + v1 ** 3 + v1 ** 2 + v1
    n_variables: 1
    sources:
    - Nguyen benchmark (Uy et al. 2011)
    - formulas + ranges from dso-org/deep-symbolic-optimization benchmarks.csv (Petersen
      et al. 2021)
    vars:
      v1:
        name: x1
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
  Nguyen-5:
    raw: sin(x1 ** 2) * cos(x1) - 1
    prepared: sin(v1 ** 2) * cos(v1) - 1
    n_variables: 1
    sources:
    - Nguyen benchmark (Uy et al. 2011)
    - formulas + ranges from dso-org/deep-symbolic-optimization benchmarks.csv (Petersen
      et al. 2021)
    vars:
      v1:
        name: x1
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
  Nguyen-6:
    raw: sin(x1) + sin(x1 + x1 ** 2)
    prepared: sin(v1) + sin(v1 + v1 ** 2)
    n_variables: 1
    sources:
    - Nguyen benchmark (Uy et al. 2011)
    - formulas + ranges from dso-org/deep-symbolic-optimization benchmarks.csv (Petersen
      et al. 2021)
    vars:
      v1:
        name: x1
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
  Nguyen-7:
    raw: log(x1 + 1) + log(x1 ** 2 + 1)
    prepared: log(v1 + 1) + log(v1 ** 2 + 1)
    n_variables: 1
    sources:
    - Nguyen benchmark (Uy et al. 2011)
    - formulas + ranges from dso-org/deep-symbolic-optimization benchmarks.csv (Petersen
      et al. 2021)
    vars:
      v1:
        name: x1
        sample_range:
        - 0.0
        - 2.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
  Nguyen-8:
    raw: sqrt(x1)
    prepared: sqrt(v1)
    n_variables: 1
    sources:
    - Nguyen benchmark (Uy et al. 2011)
    - formulas + ranges from dso-org/deep-symbolic-optimization benchmarks.csv (Petersen
      et al. 2021)
    vars:
      v1:
        name: x1
        sample_range:
        - 0.0
        - 4.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
  Nguyen-9:
    raw: sin(x1) + sin(x2 ** 2)
    prepared: sin(v1) + sin(v2 ** 2)
    n_variables: 2
    sources:
    - Nguyen benchmark (Uy et al. 2011)
    - formulas + ranges from dso-org/deep-symbolic-optimization benchmarks.csv (Petersen
      et al. 2021)
    vars:
      v1:
        name: x1
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v2:
        name: x2
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    source_audit: 'range of Uy et al. 2011 Table 3 ([-1, 1]^2; DSO: [0, 1]^2)'
    meta:
      finite_fraction: 1.0
  Nguyen-10:
    raw: 2 * sin(x1) * cos(x2)
    prepared: 2 * sin(v1) * cos(v2)
    n_variables: 2
    sources:
    - Nguyen benchmark (Uy et al. 2011)
    - formulas + ranges from dso-org/deep-symbolic-optimization benchmarks.csv (Petersen
      et al. 2021)
    vars:
      v1:
        name: x1
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v2:
        name: x2
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    source_audit: 'range of Uy et al. 2011 Table 3 ([-1, 1]^2; DSO: [0, 1]^2)'
    meta:
      finite_fraction: 1.0
  Nguyen-11:
    raw: x1 ** x2
    prepared: v1 ** v2
    n_variables: 2
    sources:
    - Nguyen benchmark (Uy et al. 2011)
    - formulas + ranges from dso-org/deep-symbolic-optimization benchmarks.csv (Petersen
      et al. 2021)
    vars:
      v1:
        name: x1
        sample_range:
        - 0.0
        - 1.0
        sample_type:
        - uni
        - pos
      v2:
        name: x2
        sample_range:
        - 0.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    meta:
      finite_fraction: 1.0
    test:
      vars:
        v1:
          dist:
            name: grid
            kwargs:
              low: 0.0
              high: 1.0
              step: 0.01
        v2:
          dist:
            name: grid
            kwargs:
              low: 0.0
              high: 1.0
              step: 0.01
    test_source: 'M. Keijzer, EuroGP 2003, author preprint p. 9 Table 3 (page crop catalog-prep/raw/fresh-10/keijzer2003_p9_table3.png,
      opened); caption: ''The training and testing ranges are denoted using [start:step:stop]
      notation when the set is created using regular intervals. The notation rnd(min,max)
      defines random (uniform) sampling in the range, while the mesh([start:step:stop])
      defines regular sampling in t'
  Nguyen-12:
    raw: x1 ** 4 - x1 ** 3 + x2 ** 2 / 2 - x2
    prepared: v1 ** 4 - v1 ** 3 + v2 ** 2 / 2 - v2
    n_variables: 2
    sources:
    - Nguyen benchmark (Uy et al. 2011)
    - formulas + ranges from dso-org/deep-symbolic-optimization benchmarks.csv (Petersen
      et al. 2021)
    vars:
      v1:
        name: x1
        sample_range:
        - 0.0
        - 1.0
        sample_type:
        - uni
        - pos
      v2:
        name: x2
        sample_range:
        - 0.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
