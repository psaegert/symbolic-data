metadata:
  name: dgsr-additional-feynman
  version: 2
  benchmark: "dgsr-additional-feynman"
  tags: {"origin": "science formula", "tags": []}
  license: "CC BY 4.0 (Holt et al. 2023, DGSR, arXiv:2401.00282, Table 35) + BSD-3-Clause (benchmarks.csv, DSO fork in samholt/DeepGenerativeSymbolicRegression)"
  citation: {"paper": {"short": "Holt et al. 2023", "title": "Deep Generative Symbolic Regression", "venue": "ICLR 2023", "url": "https://arxiv.org/abs/2401.00282"}, "data": {"short": "GitHub samholt/DeepGenerativeSymbolicRegression@5dbf04d", "title": "DGSR benchmarks.csv (DSO fork in the authors' repository)", "url": "https://github.com/samholt/DeepGenerativeSymbolicRegression/blob/5dbf04d413b2e67f7431407dfbd2597215723ca8/libs/sd3/dso/dso/task/regression/benchmarks.csv"}}
  srbf_changes: []
  srbf_notes: ["Paper and code differ: A-32 draws its inputs on U(1, 3), as the authors' code and experiment log do; the paper's Table 35 prints U(4, 6)."]
  description: DGSR Additional Feynman
  sources:
  - https://arxiv.org/abs/2401.00282
  - https://arxiv.org/pdf/2401.00282
  - https://openreview.net/forum?id=o7koEEMA1bR
  - https://github.com/samholt/DeepGenerativeSymbolicRegression/tree/5dbf04d413b2e67f7431407dfbd2597215723ca8
  - https://github.com/samholt/DeepGenerativeSymbolicRegression/blob/5dbf04d413b2e67f7431407dfbd2597215723ca8/libs/sd3/dso/dso/task/regression/benchmarks.csv
  - https://raw.githubusercontent.com/samholt/DeepGenerativeSymbolicRegression/5dbf04d413b2e67f7431407dfbd2597215723ca8/libs/sd3/dso/dso/task/regression/benchmarks.csv
  - https://github.com/samholt/DeepGenerativeSymbolicRegression/blob/5dbf04d413b2e67f7431407dfbd2597215723ca8/datasets/process.py
  - https://github.com/samholt/DeepGenerativeSymbolicRegression/blob/5dbf04d413b2e67f7431407dfbd2597215723ca8/datasets/FeynmanEquations.csv
  - https://github.com/samholt/DeepGenerativeSymbolicRegression/blob/5dbf04d413b2e67f7431407dfbd2597215723ca8/datasets/BonusEquations.csv
  - https://github.com/samholt/DeepGenerativeSymbolicRegression/blob/5dbf04d413b2e67f7431407dfbd2597215723ca8/libs/sd3/dso/dso/task/regression/dataset.py
  - https://github.com/samholt/DeepGenerativeSymbolicRegression/blob/5dbf04d413b2e67f7431407dfbd2597215723ca8/libs/sd3/dso/dso/task/regression/function_sets.csv
  - https://github.com/samholt/DeepGenerativeSymbolicRegression/blob/5dbf04d413b2e67f7431407dfbd2597215723ca8/run_recovery_multi.py
  - https://github.com/samholt/DeepGenerativeSymbolicRegression/blob/5dbf04d413b2e67f7431407dfbd2597215723ca8/process_results/results/all_run_recovery_multi-20220924-180429-fn_d_all_log_f.txt
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  conventions:
    rules: 'srbf formula catalogs: the benchmark''s formulas, constants and input distributions; srbf draws the points (512
      to fit, 512 to test) and sets the noise; a value the authors draw anew for every run (a constant, an input''s range)
      is drawn with the points (the entry''s per_run block); srbf''s release freezes one draw per problem'
expressions:
