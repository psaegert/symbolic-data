        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x1: U[1,2]
      x2: U[1,2]
      x3: U[1,2]
      x4: U[1,2]
      x5: U[1,2]
      x6: U[1,2]
      x7: U[1,2]
      x8: U[1,2]
      x9: U[1,2]
    meta:
      finite_fraction: 1.0
