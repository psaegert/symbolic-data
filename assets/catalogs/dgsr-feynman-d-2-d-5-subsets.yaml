metadata:
  name: dgsr-feynman-d-2-d-5-subsets
  version: 1
  tags: {"origin": "science formula", "tags": []}
  description: DGSR Feynman d=2 / d=5 subsets
  sources:
  - https://arxiv.org/abs/2401.00282
  - https://arxiv.org/pdf/2401.00282v1
  - https://openreview.net/forum?id=o7koEEMA1bR
  - https://github.com/samholt/DeepGenerativeSymbolicRegression/tree/5dbf04d413b2e67f7431407dfbd2597215723ca8
  - https://github.com/samholt/DeepGenerativeSymbolicRegression/blob/5dbf04d413b2e67f7431407dfbd2597215723ca8/libs/sd3/dso/dso/task/regression/benchmarks.csv
  - https://github.com/samholt/DeepGenerativeSymbolicRegression/blob/5dbf04d413b2e67f7431407dfbd2597215723ca8/libs/sd3/dso/dso/task/regression/dataset.py
  - https://github.com/samholt/DeepGenerativeSymbolicRegression/blob/5dbf04d413b2e67f7431407dfbd2597215723ca8/datasets/FeynmanEquations.csv
  - https://github.com/samholt/DeepGenerativeSymbolicRegression/blob/5dbf04d413b2e67f7431407dfbd2597215723ca8/README.md
  - https://github.com/intell-sci-comput/PSE/blob/7105caba63e754150dd3b160443984456ec99cd7/benchmark/benchmark_Feynman.csv
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/interrupted-4.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  Feynman-11:
    raw: x1*x2/(x5*(x3**2-x4**2))
    prepared: v1*v2/(v5*(v3**2 - v4**2))
    n_variables: 5
    subset: all
    vars:
      v1:
        name: x1
        sample_range:
        - 1.0
        - 3.0
        sample_type:
        - uni
        - pos
      v2:
        name: x2
        sample_range:
        - 1.0
        - 3.0
        sample_type:
        - uni
        - pos
      v3:
        name: x3
        sample_range:
        - 1.0
        - 3.0
        sample_type:
        - uni
        - pos
      v4:
        name: x4
        sample_range:
        - 1.0
        - 3.0
        sample_type:
        - uni
        - pos
      v5:
        name: x5
        sample_range:
        - 1.0
        - 3.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x1: U[1,3]
      x2: U[1,3]
      x3: U[1,3]
      x4: U[1,3]
      x5: U[1,3]
    meta:
      finite_fraction: 1.0
  Feynman-13:
    raw: x1*(exp(x2*x3/(x4*x5))-1)
    prepared: v1*(exp(v2*v3/(v4*v5)) - 1)
    n_variables: 5
    subset: all
    vars:
      v1:
        name: x1
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v2:
        name: x2
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v3:
        name: x3
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v4:
        name: x4
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v5:
        name: x5
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x1: U[1,5]
      x2: U[1,5]
      x3: U[1,5]
      x4: U[1,5]
      x5: U[1,5]
    meta:
      finite_fraction: 1.0
