metadata:
  name: dgsr-feynman-d-2-d-5-subsets
  version: 2
  benchmark: "dgsr-feynman-d-2-d-5-subsets"
  tags: {"origin": "science formula", "tags": []}
  license: "CC BY 4.0 (Holt et al. 2023, DGSR, arXiv:2401.00282) + BSD-3-Clause (benchmarks.csv, DSO fork in samholt/DeepGenerativeSymbolicRegression)"
  citation: {"paper": {"short": "Holt et al. 2023", "title": "Deep Generative Symbolic Regression", "venue": "ICLR 2023", "url": "https://arxiv.org/abs/2401.00282"}, "data": {"short": "GitHub samholt/DeepGenerativeSymbolicRegression@5dbf04d", "title": "DGSR benchmarks.csv (DSO fork in the authors' repository)", "url": "https://github.com/samholt/DeepGenerativeSymbolicRegression/blob/5dbf04d413b2e67f7431407dfbd2597215723ca8/libs/sd3/dso/dso/task/regression/benchmarks.csv"}}
  srbf_changes: []
  description: DGSR Feynman d=2 / d=5 subsets
  sources:
  - https://arxiv.org/abs/2401.00282
  - https://arxiv.org/pdf/2401.00282v1
  - https://openreview.net/forum?id=o7koEEMA1bR
  - https://github.com/samholt/DeepGenerativeSymbolicRegression/tree/5dbf04d413b2e67f7431407dfbd2597215723ca8
  - https://github.com/samholt/DeepGenerativeSymbolicRegression/blob/5dbf04d413b2e67f7431407dfbd2597215723ca8/libs/sd3/dso/dso/task/regression/benchmarks.csv
  - https://github.com/samholt/DeepGenerativeSymbolicRegression/blob/5dbf04d413b2e67f7431407dfbd2597215723ca8/libs/sd3/dso/dso/task/regression/dataset.py
  - https://github.com/samholt/DeepGenerativeSymbolicRegression/blob/5dbf04d413b2e67f7431407dfbd2597215723ca8/datasets/FeynmanEquations.csv
  - https://github.com/samholt/DeepGenerativeSymbolicRegression/blob/5dbf04d413b2e67f7431407dfbd2597215723ca8/README.md
  - https://github.com/intell-sci-comput/PSE/blob/7105caba63e754150dd3b160443984456ec99cd7/benchmark/benchmark_Feynman.csv
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  conventions:
    rules: 'srbf formula catalogs: the benchmark''s formulas, constants and input distributions; srbf draws the points (512
      to fit, 512 to test) and sets the noise; a value the authors draw anew for every run (a constant, an input''s range)
      is drawn with the points (the entry''s per_run block); srbf''s release freezes one draw per problem'
expressions:
  Feynman-11:
    raw: x1*x2/(x5*(x3**2-x4**2))
    prepared: v1*v2/(v5*(v3**2 - v4**2))
    n_variables: 5
    subset: all
    vars:
      v1:
        name: x1
        sample_range:
        - 1.0
        - 3.0
        sample_type:
        - uni
        - pos
      v2:
        name: x2
        sample_range:
        - 1.0
        - 3.0
        sample_type:
        - uni
        - pos
      v3:
        name: x3
        sample_range:
        - 1.0
        - 3.0
        sample_type:
        - uni
        - pos
      v4:
        name: x4
        sample_range:
        - 1.0
        - 3.0
        sample_type:
        - uni
        - pos
      v5:
        name: x5
        sample_range:
        - 1.0
        - 3.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x1: U[1,3]
      x2: U[1,3]
      x3: U[1,3]
      x4: U[1,3]
      x5: U[1,3]
    meta:
      finite_fraction: 1.0
  Feynman-13:
    raw: x1*(exp(x2*x3/(x4*x5))-1)
    prepared: v1*(exp(v2*v3/(v4*v5)) - 1)
    n_variables: 5
    subset: all
    vars:
      v1:
        name: x1
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v2:
        name: x2
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v3:
        name: x3
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v4:
        name: x4
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v5:
        name: x5
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x1: U[1,5]
      x2: U[1,5]
      x3: U[1,5]
      x4: U[1,5]
      x5: U[1,5]
    meta:
      finite_fraction: 1.0
  Feynman-1:
    raw: mu*Nn
    prepared: v1*v2
    n_variables: 2
    sources:
    - Feynman Symbolic Regression Database (Udrescu & Tegmark 2020, AI Feynman)
    - machine-readable FeynmanEquations.csv via the psaegert/ansr-data mirror
    vars:
      v1:
        name: mu
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v2:
        name: Nn
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v0:
        name: F
    subset: feynman-d2
    meta:
      same_as: feynman:I.12.1
      finite_fraction: 1.0
  Feynman-2:
