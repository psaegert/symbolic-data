        - 10.0
        sample_type:
        - log
        - pos
      v3:
        name: B
        sample_range:
        - 0.1
        - 10.0
        sample_type:
        - log
        - pos
      v4:
        name: v
        sample_range:
        - 0.1
        - 10.0
        sample_type:
        - log
        - pos
      v5:
        name: theta
        sample_range:
        - 0.0
        - 6.283185307179586
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      q: log-uniform (base 10) magnitude on [0.1, 10], sign + or - with probability 1/2 each, i.e. x in [-10, -0.1] U [0.1,
        10] (DefaultSampling(0.1, 10), both signs)
      Ef: log-uniform (base 10) on [0.1, 10], positive (DefaultSampling(0.1, 10, uses_negative=False))
      B: log-uniform (base 10) on [0.1, 10], positive (DefaultSampling(0.1, 10, uses_negative=False))
      v: log-uniform (base 10) on [0.1, 10], positive (DefaultSampling(0.1, 10, uses_negative=False))
      theta: uniform U[0, 2*pi] (SimpleSampling(0.0, 2 * np.pi, uses_negative=False))
    meta:
      finite_fraction: 1.0
  FeynmanICh26Eq2:
    raw: sin(theta1)/sin(theta2)
    prepared: sin(v1)/sin(v2)
    n_variables: 2
    subset: remainder
    vars:
      v1:
        name: theta1
        sample_range:
        - 0.0
        - 6.283185307179586
        sample_type:
        - uni
        - pos
      v2:
        name: theta2
        sample_range:
