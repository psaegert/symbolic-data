        - 10.0
        sample_type:
        - log
        - pos
      v0:
        name: y
    input_distributions:
      d1: log-uniform (base 10) on [0.001, 0.1], positive (DefaultSampling(0.001, 0.1, uses_negative=False))
      n: log-uniform (base 10) on [0.1, 10], positive (DefaultSampling(0.1, 10, uses_negative=False))
      d2: log-uniform (base 10) on [0.001, 10], positive (DefaultSampling(0.001, 10, uses_negative=False))
    meta:
      finite_fraction: 1.0
  FeynmanICh29Eq16:
    raw: sqrt(x1**2 + x2**2 + 2*x1*x2*cos(theta1 - theta2))
