        - 6.283185307179586
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      theta1: uniform U[0, 2*pi] (SimpleSampling(0, 2 * np.pi, uses_negative=False))
      theta2: uniform U[0, 2*pi] (SimpleSampling(0, 2 * np.pi, uses_negative=False))
    meta:
      finite_fraction: 1.0
  FeynmanICh27Eq6:
    raw: 1/(1/d1 + n/d2)
    prepared: 1/(v2/v3 + 1/v1)
    n_variables: 3
    subset: remainder
    vars:
      v1:
        name: d1
        sample_range:
