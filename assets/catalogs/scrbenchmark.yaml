        - pos
      v0:
        name: y
    input_distributions:
      x1: log-uniform (base 10) on [0.1, 10], positive (DefaultSampling(0.1, 10, uses_negative=False))
      x2: log-uniform (base 10) on [0.1, 10], positive (DefaultSampling(0.1, 10, uses_negative=False))
      theta1: uniform U[0, 2*pi] (SimpleSampling(0, 2 * np.pi, uses_negative=False))
      theta2: uniform U[0, 2*pi] (SimpleSampling(0, 2 * np.pi, uses_negative=False))
    meta:
