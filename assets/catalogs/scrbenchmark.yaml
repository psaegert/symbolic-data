metadata:
  name: scrbenchmark
  version: 1
  tags: {"origin": "science formula", "tags": []}
  license: "MIT (prescriptiveanalytics/SCR-Benchmarks; SRSD laws: omron-sinicx/srsd-benchmark, MIT)"
  citation: {"paper": {"short": "Bachinger et al. 2025", "title": "SCRBenchmark: A Benchmarking Library for Shape-Constrained Regression", "venue": "Proceedings of the Genetic and Evolutionary Computation Conference Companion (GECCO '25 Companion), pp. 2505-2513", "url": "https://doi.org/10.1145/3712255.3734280"}, "data": {"short": "GitHub prescriptiveanalytics/SCR-Benchmarks@2869bd5", "title": "SCR-Benchmarks (MIT)", "url": "https://github.com/prescriptiveanalytics/SCR-Benchmarks/tree/2869bd564ff5eaa859577f02504752411bed817f"}}
  description: SCRBenchmark (shape-constrained regression on SRSD-Feynman; Bachinger, Werth, Zenisek, Haider & de Franca,
    GECCO 2025 Companion)
  sources:
  - https://github.com/prescriptiveanalytics/SCR-Benchmarks/tree/2869bd564ff5eaa859577f02504752411bed817f
  - https://github.com/prescriptiveanalytics/SCR-Benchmarks/blob/2869bd564ff5eaa859577f02504752411bed817f/SCRBenchmark/SRSDFeynman/feynman.py
  - https://github.com/prescriptiveanalytics/SCR-Benchmarks/blob/2869bd564ff5eaa859577f02504752411bed817f/SCRBenchmark/Data/feynman_srsd_info.py
  - https://github.com/prescriptiveanalytics/SCR-Benchmarks/blob/2869bd564ff5eaa859577f02504752411bed817f/SCRBenchmark/sampling.py
  - https://github.com/prescriptiveanalytics/SCR-Benchmarks/blob/2869bd564ff5eaa859577f02504752411bed817f/SCRBenchmark/base.py
  - https://github.com/prescriptiveanalytics/SCR-Benchmarks/blob/2869bd564ff5eaa859577f02504752411bed817f/SCRBenchmark/suite.py
  - https://github.com/prescriptiveanalytics/SCR-Benchmarks/blob/2869bd564ff5eaa859577f02504752411bed817f/SCRBenchmark/benchmark.py
  - https://github.com/prescriptiveanalytics/SCR-Benchmarks/blob/2869bd564ff5eaa859577f02504752411bed817f/SCRBenchmark/seeds.py
  - https://github.com/prescriptiveanalytics/SCR-Benchmarks/blob/2869bd564ff5eaa859577f02504752411bed817f/generate/2-generate_test_sets.py
  - https://github.com/prescriptiveanalytics/SCR-Benchmarks/blob/2869bd564ff5eaa859577f02504752411bed817f/SCRBenchmark/Data/feynman_srsdf_constraint_info.py
  - https://github.com/prescriptiveanalytics/SCR-Benchmarks/tree/2869bd564ff5eaa859577f02504752411bed817f/SCRBenchmark/Data/Test
  - https://doi.org/10.1145/3712255.3734280
  - https://pure.fh-ooe.at/de/publications/scrbenchmark-a-benchmarking-library-for-shape-constrained-regress/
  - https://github.com/omron-sinicx/srsd-benchmark/blob/6f47a48/datasets/feynman.py
  - https://github.com/omron-sinicx/srsd-benchmark/blob/6f47a48/datasets/sampling.py
  - https://github.com/omron-sinicx/srsd-benchmark/commit/b72819c
  - https://github.com/prescriptiveanalytics/SCR-Benchmark-SCSR
  - https://github.com/prescriptiveanalytics/SCR-Benchmark-SCPR
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/critic-1.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  FeynmanICh9Eq18:
    raw: 6.67430e-11*m1*m2/((x2 - x1)**2 + (y2 - y1)**2 + (z2 - z1)**2)
    prepared: 6.6743e-11*v1*v2/((v3 - v4)**2 + (v5 - v6)**2 + (v7 - v8)**2)
    n_variables: 8
    subset: hard
    vars:
      v1:
        name: m1
        sample_range:
        - 0.1
        - 10.0
        sample_type:
        - log
        - pos
      v2:
        name: m2
        sample_range:
        - 0.1
        - 10.0
        sample_type:
        - log
        - pos
      v3:
        name: x2
        sample_range:
        - 0.1
        - 10.0
        sample_type:
        - log
        - pos_neg
      v4:
        name: x1
        sample_range:
        - 0.1
        - 10.0
        sample_type:
        - log
        - pos_neg
      v5:
        name: y2
        sample_range:
        - 0.1
        - 10.0
        sample_type:
        - log
        - pos_neg
      v6:
        name: y1
        sample_range:
        - 0.1
        - 10.0
        sample_type:
        - log
        - pos_neg
      v7:
        name: z2
        sample_range:
        - 0.1
        - 10.0
        sample_type:
        - log
        - pos_neg
      v8:
        name: z1
        sample_range:
        - 0.1
        - 10.0
        sample_type:
        - log
        - pos_neg
      v0:
        name: y
    input_distributions:
      m1: log-uniform (base 10) on [0.1, 10], positive (DefaultSampling(0.1, 10, uses_negative=False))
      m2: log-uniform (base 10) on [0.1, 10], positive (DefaultSampling(0.1, 10, uses_negative=False))
      x2: log-uniform (base 10) magnitude on [0.1, 10], sign + or - with probability 1/2 each, i.e. x in [-10, -0.1] U [0.1,
        10] (DefaultSampling(0.1, 10), both signs)
      x1: log-uniform (base 10) magnitude on [0.1, 10], sign + or - with probability 1/2 each, i.e. x in [-10, -0.1] U [0.1,
        10] (DefaultSampling(0.1, 10), both signs)
      y2: log-uniform (base 10) magnitude on [0.1, 10], sign + or - with probability 1/2 each, i.e. x in [-10, -0.1] U [0.1,
        10] (DefaultSampling(0.1, 10), both signs)
      y1: log-uniform (base 10) magnitude on [0.1, 10], sign + or - with probability 1/2 each, i.e. x in [-10, -0.1] U [0.1,
        10] (DefaultSampling(0.1, 10), both signs)
      z2: log-uniform (base 10) magnitude on [0.1, 10], sign + or - with probability 1/2 each, i.e. x in [-10, -0.1] U [0.1,
        10] (DefaultSampling(0.1, 10), both signs)
      z1: log-uniform (base 10) magnitude on [0.1, 10], sign + or - with probability 1/2 each, i.e. x in [-10, -0.1] U [0.1,
        10] (DefaultSampling(0.1, 10), both signs)
    meta:
      finite_fraction: 1.0
  FeynmanICh12Eq11:
    raw: q*(Ef + B*v*sin(theta))
    prepared: v1*(v2 + v3*v4*sin(v5))
    n_variables: 5
    subset: remainder
    vars:
      v1:
        name: q
        sample_range:
        - 0.1
        - 10.0
        sample_type:
        - log
        - pos_neg
      v2:
        name: Ef
        sample_range:
