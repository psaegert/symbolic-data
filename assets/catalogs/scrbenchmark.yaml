        U [1e-22, 1e-20] (DefaultSampling(1e-22, 1e-20), both signs)
      Ef: log-uniform (base 10) magnitude on [10, 1000], sign + or - with probability 1/2 each, i.e. x in [-1000, -10] U [10,
        1000] (DefaultSampling(10, 1000), both signs)
      t: log-uniform (base 10) on [1e-18, 1e-16], positive (DefaultSampling(1e-18, 1e-16, uses_negative=False))
      omega: log-uniform (base 10) on [1e+08, 1e+10], positive (DefaultSampling(1e+08, 1e+10, uses_negative=False))
      omega_0: log-uniform (base 10) on [1e+08, 1e+10], positive (DefaultSampling(1e+08, 1e+10, uses_negative=False))
