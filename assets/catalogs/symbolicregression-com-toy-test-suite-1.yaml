metadata:
  name: symbolicregression-com-toy-test-suite-1
  version: 1
  tags: {"origin": "classic benchmark", "tags": ["extrapolation"]}
  description: symbolicregression.com Toy Test Suite 1
  sources:
  - http://web.archive.org/web/20131208225350/http://symbolicregression.com/?q=node/5
  - https://web.archive.org/web/20150319205121/http://symbolicregression.com/?q=node/5
  - https://web.archive.org/web/20131208231846/http://symbolicregression.com/?q=toyProblems
  - https://web.archive.org/web/20131208230430/http://symbolicregression.com/?q=benchmarks
  - https://web.archive.org/web/20131208231130/http://symbolicregression.com/?q=contact
  - http://www.cs.ucl.ac.uk/staff/W.Langdon/ftp/papers/vladislavleva_2008_thesis.pdf
  - https://web.archive.org/web/20141006102506/http://symbolicregression.com/sites/SRDocuments/NonlinearityPreprint.pdf
  - https://doi.org/10.1109/TEVC.2008.926486
  - https://raw.githubusercontent.com/DEAP/deap/8a96fd3a75026f7b30e835f595a5199c75634ddf/deap/benchmarks/gp.py
  - 'local: symbolic-data/assets/catalogs/vladislavleva.yaml (Vladislavleva-1 line 23, -4 line 154, -7 line 335)'
  - 'local: symbolic-data/assets/upstream/dso_benchmarks.csv line 95'
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-14.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  Ripple2d:
    raw: (x1 - 3)*(x2 - 3) + 2*sin((x1 - 4)*(x2 - 4))
    prepared: (v1 - 3)*(v2 - 3) + 2*sin((v1 - 4)*(v2 - 4))
    n_variables: 2
    subset: all
    vars:
      v1:
        name: x1
        sample_range:
        - 0.05
        - 6.05
        sample_type:
        - uni
        - pos
      v2:
        name: x2
        sample_range:
        - 0.05
        - 6.05
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x1: 'uniform U[0.05, 6.05] (the website gives none; the same author defines this identical function with x1, x2 = Rand(0.05,
        6.05), 300 training points: thesis Table 4.1 p.118 / PDF p.142 and TEC preprint Table I p.10)'
      x2: uniform U[0.05, 6.05] (as x1; thesis Table 4.1, TEC preprint Table I)
    test:
      vars:
        v1:
          dist:
            name: uniform
            kwargs:
              low: -0.25
              high: 6.35
        v2:
          dist:
            name: uniform
            kwargs:
              low: -0.25
              high: 6.35
    test_source: 'Vladislavleva, Smits & den Hertog 2009, IEEE TEC 13(2), preprint p. 10 Table I ''Sampling strategy for training
      and test data'' (source-audit/raw/A3/vladislavleva2009_preprint_p10_tableI.png and vladislavleva2009_nonlinearity_preprint.pdf,
      opened). Notation: ''x = Rand(a, b) means that the x variable is sampled randomly from an interval [a, b]. Notation
      x1 = (a1 : c1 : b1), x2 = (a2 : c2 : b2) determ'
    meta:
      finite_fraction: 1.0
