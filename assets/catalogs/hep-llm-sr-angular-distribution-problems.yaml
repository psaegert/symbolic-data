metadata:
  name: hep-llm-sr-angular-distribution-problems
  version: 2
  benchmark: "hep-llm-sr-angular-distribution-problems"
  tags: {"origin": "science formula", "tags": ["extrapolation", "srbf-modified"]}
  license: "CC BY 4.0 (Morales-Alvarado 2025, arXiv:2510.03397)"
  citation: {"paper": {"short": "Morales-Alvarado 2025", "title": "Foundation models for equation discovery in high energy physics", "venue": "arXiv preprint arXiv:2510.03397", "url": "https://arxiv.org/abs/2510.03397"}}
  srbf_changes: [{"kind": "part", "problems": 3, "text": "srbf runs the 2 formula problems of the paper; its 3 data tasks were never published."}, {"kind": "changed", "problems": 2, "text": "The authors work with binned data (30 bins in cos theta); srbf samples cos theta uniformly at random, and tests the out-of-domain problem on the 30 bin centres."}, {"kind": "changed", "problems": 2, "text": "The physical constants are priced as numbers: alpha = 0.00755 (the MadGraph default the authors quote in their earlier paper), s = 10^6 GeV^2 (sqrt(s) = 1 TeV) and the unit conversion (hbar c)^2 = 0.3893793721e9 pb GeV^2; a method recovers the law with their product as one constant."}]
  description: HEP LLM-SR angular-distribution problems
  display_name: "HEP LLM-SR angular-distribution problems*"
  modified_by_srbf: 'the physical constants are priced as numbers: alpha = 0.00755 (the MadGraph default the authors quote
    in their earlier paper, arXiv:2508.00989), s = 10^6 GeV^2 (sqrt(s) = 1 TeV) and the unit conversion (hbar c)^2 = 0.3893793721e9
    pb GeV^2; a method recovers the law with their product as one constant'
  sources:
  - https://arxiv.org/abs/2510.03397
  - https://arxiv.org/pdf/2510.03397
  - https://arxiv.org/e-print/2510.03397
  - https://arxiv.org/abs/2508.00989
  - https://arxiv.org/e-print/2508.00989
  - https://doi.org/10.1007/JHEP02(2026)081
  - https://arxiv.org/abs/2412.07839
  - https://arxiv.org/e-print/2412.07839
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  conventions:
    rules: 'srbf formula catalogs: the benchmark''s formulas, constants and input distributions; srbf draws the points (512
      to fit, 512 to test) and sets the noise; a value the authors draw anew for every run (a constant, an input''s range)
      is drawn with the points (the entry''s per_run block); srbf''s release freezes one draw per problem'
expressions:
  ee_mumu_angular_id:
    subset: "hep-llm-sr-angular-distribution-problems"
    raw: 2*pi*hbarc2*alpha**2/(4*s)*(1 + cos_theta**2)
    prepared: 0.0110977988290651*3.141592653589793*(v1**2 + 1)
    n_variables: 1
    vars:
      v1:
        name: cos_theta
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      cos_theta: U[-1, 1]
    meta:
      finite_fraction: 1.0
  ee_mumu_angular_ood:
    subset: "hep-llm-sr-angular-distribution-problems"
    raw: 2*pi*hbarc2*alpha**2/(4*s)*(1 + cos_theta**2)
    prepared: 0.0110977988290651*3.141592653589793*(v1**2 + 1)
    n_variables: 1
    vars:
      v1:
        name: cos_theta
        sample_range:
        - -0.3333333333333333
        - 0.3333333333333333
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      cos_theta: fit U[-1/3, 1/3]; evaluate U[-1, 1]
    test:
      vars:
        v1:
          dist:
            name: grid
            kwargs:
              low: -0.9666666666666667
              high: 0.9666666666666667
              step: 0.06666666666666667
    test_source: 'Morales-Alvarado, arXiv:2510.03397, main.tex l.148-150 and l.187, as quoted in the records: ''interpolation
      (in-domain), where it is trained across the full kinematic range''; ''we train the regressor on a random 80% subsample
      of the data and evaluate its performance across the domain''; OOD: ''trained only on data from the central region around
      cos theta ~ 0, and its predictions are evaluated across t'
    meta:
      finite_fraction: 1.0
