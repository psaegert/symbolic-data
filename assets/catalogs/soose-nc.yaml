      history, see assets/upstream/soose/NOTICE)'
    vars:
      v1:
        name: x_1
        sample_range:
        - -10.0
        - 10.0
        sample_type:
        - uni
        - pos
      v2:
        name: x_2
        sample_range:
        - -10.0
        - 10.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    meta:
      finite_fraction: 0.9287
    subset: iid
