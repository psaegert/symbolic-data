metadata:
  name: rsrm-constant-optimization-benchmark
  version: 1
  tags: {"origin": "classic benchmark", "tags": []}
  srbf_changes: [{"kind": "part", "problems": 4, "text": "srbf runs 93 of the 97 pairs of expression and input range: 4 are identical to problems srbf runs in its Constant and Keijzer sets."}, {"kind": "filled", "problems": 93, "text": "The appendix gives only a range for the inputs, not how points are spread over it or whether all inputs share it; srbf samples every input uniformly on the same range."}]
  license: "facts only: formulas and ranges cited from Xu, Liu & Sun 2024 (RSRM, ICLR 2024, Appendix C.6, Table S8); no upstream license"
  citation: {"paper": {"short": "Xu et al. 2024", "title": "Reinforcement Symbolic Regression Machine", "venue": "ICLR 2024 (proceedings version, App. C.6)", "url": "https://proceedings.iclr.cc/paper_files/paper/2024/file/ef3a55fa15aa5fe39b7a2617b3a5d06e-Paper-Conference.pdf"}}
  description: RSRM constant-optimization benchmark
  sources:
  - https://proceedings.iclr.cc/paper_files/paper/2024/file/ef3a55fa15aa5fe39b7a2617b3a5d06e-Paper-Conference.pdf
  - https://openreview.net/forum?id=PJVUWpPnZC
  - https://arxiv.org/abs/2305.14656v1
  - https://github.com/intell-sci-comput/RSRM/tree/90ae46215504cc0cf3ad19974a6bdc23f8f02bbe
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-29.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
