    raw: 0.5*exp(x1)*sin(2*x2)
    prepared: 0.5*exp(v1)*sin(2*v2)
    n_variables: 2
    subset: toy-cases
    vars:
      v1:
        name: x1
        sample_range:
        - -3.0
        - 3.0
        sample_type:
        - uni
        - pos
      v2:
        name: x2
        sample_range:
        - -3.0
        - 3.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x1: 'uniform box U[-3,3] (Appendix A: ''x_i in [-3, 3]''). The authors fix only the region: Sec. 4.3 p. 11 prefers ''controlled
        sampling methods such as Latin hypercube sampling ... and orthogonal sampling'' for ''as uniform as possible'' points;
        Sec. 5.1.1 p. 12: 200 sampling points per independent variable (information only).'
      x2: 'uniform box U[-3,3] (Appendix A: ''x_i in [-3, 3]''). The authors fix only the region: Sec. 4.3 p. 11 prefers ''controlled
        sampling methods such as Latin hypercube sampling ... and orthogonal sampling'' for ''as uniform as possible'' points;
