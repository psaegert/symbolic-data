        - 50.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x: uniform U[-50, 50]
      y: uniform U[-50, 50]
      z: uniform U[-50, 50]
      v: uniform U[-50, 50]
      w: uniform U[-50, 50]
    meta:
      finite_fraction: 1.0
