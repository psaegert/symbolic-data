metadata:
  name: gp-benchmarks-sr-table
  version: 1
  tags: {"origin": "classic benchmark", "tags": ["dummy inputs"]}
  license: "facts only: formulas and ranges cited from McDermott et al. 2012 (GECCO, Table 3) and the original family papers; no upstream license"
  citation: {"paper": {"short": "McDermott et al. 2012", "title": "Genetic programming needs better benchmarks", "venue": "Proceedings of the 14th annual conference on Genetic and evolutionary computation (GECCO '12), pp. 791-798", "url": "https://doi.org/10.1145/2330163.2330273"}}
  description: GP benchmarks SR table (McDermott et al. 2012)
  sources:
  - https://doi.org/10.1145/2330163.2330273
  - https://gpbenchmarks.org/wp-content/uploads/2019/08/paper1.pdf
  - https://github.com/GMUEClab/ecj/blob/0ce5a2cd446b66c821ed4ae82662d60250da2666/ecj/src/main/java/ec/app/regression/Benchmarks.java
  - http://www.korns.com/Accuracy%20in%20Symbolic%20Regression.pdf
  - https://doi.org/10.1007/s10710-010-9121-2
  - https://mural.maynoothuniversity.ie/id/eprint/12336/1/Galvan_Semantically_2011.pdf
  - https://doi.org/10.1007/3-540-36599-0_7 (Keijzer 2003; read by sets/fresh-10.json)
  - https://doi.org/10.1109/TEVC.2008.926486 (Vladislavleva et al. 2009; read by sets/fresh-13.json)
  - 'local: symbolic-data/assets/catalogs/{koza,nguyen,pagie,korns,keijzer,vladislavleva,neat}.yaml (what srbf holds)'
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-31.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  Korns-13:
    raw: 32 - 3*(tan(x)/tan(y))*(tan(z)/tan(v))
    prepared: -3*tan(v1)*tan(v3)/(tan(v2)*tan(v4)) + 32
