    raw: 6.674e-5*mass1*mass2/distance**1.5
    prepared: 6.674e-5*v1*v2/v3**1.5
    n_variables: 3
    subset: easy
    vars:
      v1:
        name: mass1
        sample_range:
        - 1.0
        - 1000.0
        sample_type:
        - log
        - pos
      v2:
        name: mass2
        sample_range:
        - 1.0
        - 1000.0
        sample_type:
        - log
        - pos
      v3:
        name: distance
        sample_range:
        - 1.0
        - 10.0
        sample_type:
        - log
        - pos
      v0:
        name: y
    input_distributions:
      mass1: log-uniform U_log[1, 1000]
