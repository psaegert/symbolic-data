metadata:
  name: newtonbench
  version: 1
  tags: {"origin": "science formula", "tags": []}
  description: NewtonBench
  sources:
  - https://arxiv.org/abs/2510.07172
  - https://arxiv.org/pdf/2510.07172v3
  - https://arxiv.org/e-print/2510.07172v3
  - https://arxiv.org/e-print/2510.07172v1
  - https://github.com/HKUST-KnowComp/NewtonBench
  - https://github.com/HKUST-KnowComp/NewtonBench/tree/912a4ba5f4356ddd06acc16e44460ca30be4abc2/modules
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-97.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
