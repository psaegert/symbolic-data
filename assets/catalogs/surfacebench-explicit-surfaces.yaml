metadata:
  name: surfacebench-explicit-surfaces
  version: 1
  tags: {"origin": "classic benchmark", "tags": ["extrapolation", "several tests"]}
  description: SurfaceBench explicit surfaces
  sources:
  - https://arxiv.org/abs/2511.10833
  - https://arxiv.org/pdf/2511.10833v2
  - https://arxiv.org/e-print/2511.10833v2
  - https://arxiv.org/e-print/2511.10833v1
  - https://openreview.net/forum?id=sHLTzkczSi
  - https://github.com/deep-symbolic-mathematics/surfacebench/tree/619bcb0aa17cd80694798c5ca92283cd9a4e6ba4
  - https://huggingface.co/datasets/pandoradox/symbolic-regression-surfaces/tree/61d4ca80ccbe30ee7c0ed4d8f373ef9d1ba82a8f
  - https://huggingface.co/datasets/ishobhnik/SurfaceBench (gated; README at revision 582f7c54b49521283ef7b432a1f90d670ed0a2db)
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-99.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  NACS1:
    raw: sin(x**2 + y**2)/(1 + x**2 + y**2)
    prepared: sin(v1**2 + v2**2)/(v1**2 + v2**2 + 1)
    n_variables: 2
    subset: id
    vars:
      v1:
        name: x
        sample_range:
        - -5.0
        - 5.0
        sample_type:
        - uni
        - pos
      v2:
        name: y
        sample_range:
        - -5.0
        - 5.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x: uniform U(-5, 5)
      y: uniform U(-5, 5)
    meta:
      finite_fraction: 1.0
  NACS1.ood:
    raw: sin(x**2 + y**2)/(1 + x**2 + y**2)
    prepared: sin(v1**2 + v2**2)/(v1**2 + v2**2 + 1)
    n_variables: 2
    subset: ood
    vars:
      v1:
        name: x
        sample_range:
        - -5.0
        - 5.0
        sample_type:
        - uni
        - pos
      v2:
        name: y
        sample_range:
        - -5.0
        - 5.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x: uniform U(-5, 5)
      y: uniform U(-5, 5)
    test:
      vars:
        v1:
          dist:
          - name: uniform
            kwargs:
              low: -10.0
              high: -5.1
            weight: 4.9
          - name: uniform
            kwargs:
              low: 5.1
              high: 10.0
            weight: 4.9
        v2:
          dist:
          - name: uniform
            kwargs:
              low: -10.0
              high: -5.1
            weight: 4.9
          - name: uniform
            kwargs:
              low: 5.1
              high: 10.0
            weight: 4.9
    test_source: 'SurfaceBench (Kabra et al., TMLR 03/2026, arXiv:2511.10833v2; catalog-prep/raw/fresh-99/arxiv/arxiv_2511.10833v2.pdf,
      opened): Sec. 5.2 ''If a model is fitted on inputs sampled from [-5,5] along each axis, OOD tests use the non-overlapping
      exterior bands [-10, -5] U [5, 10]''; App. A.6 Table 6 caption ''Each surface includes 5k training, 500 test, and 500
      out-of-domain (OOD) samples''. Per-surface box'
    meta:
      finite_fraction: 1.0
