  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-45.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  RocketFuelFlow:
    raw: p0*A/sqrt(T0)*sqrt(1.4/287*(2/(1.4 + 1))**((1.4 + 1)/(1.4 - 1)))
    prepared: v1*v2*(0.0698430295769578*(2/(1 + 1.4))**((1 + 1.4)/(2*(1.4 - 1*1))))/sqrt(v3)
    n_variables: 3
    subset: all
    vars:
      v1:
        name: p0
        sample_range:
        - 400000.0
        - 600000.0
        sample_type:
        - uni
        - pos
      v2:
        name: A
        sample_range:
        - 0.5
        - 1.5
        sample_type:
        - uni
        - pos
      v3:
        name: T0
        sample_range:
        - 250.0
        - 260.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      p0: 'U[400000.0, 600000.0]; uniform on the closed interval [400000.0, 600000.0] (HL: ValueGenerator.GenerateUniformDistributedValues(seed,
        n, 400000.0, 600000.0) = r*(end-start)+start with r = NextUInt()/uint.MaxValue in [0, 1], end inclusive; ValueGenerator.cs
        lines 32-48). Each input is drawn independently from its own seed (a box).'
      A: 'U[0.5, 1.5]; uniform on the closed interval [0.5, 1.5] (HL: ValueGenerator.GenerateUniformDistributedValues(seed,
        n, 0.5, 1.5) = r*(end-start)+start with r = NextUInt()/uint.MaxValue in [0, 1], end inclusive; ValueGenerator.cs lines
        32-48). Each input is drawn independently from its own seed (a box).'
      T0: 'U[250.0, 260.0]; uniform on the closed interval [250.0, 260.0] (HL: ValueGenerator.GenerateUniformDistributedValues(seed,
        n, 250.0, 260.0) = r*(end-start)+start with r = NextUInt()/uint.MaxValue in [0, 1], end inclusive; ValueGenerator.cs
        lines 32-48). Each input is drawn independently from its own seed (a box).'
    meta:
      finite_fraction: 1.0
  AircraftLift:
    raw: C_Lalpha*(alpha - (-2.0)) + C_Ldelta_e*delta_e*S_HT/S_ref
    prepared: v1*(v2 + 2.0) + v3*v4*v5/v6
    n_variables: 6
    subset: all
    vars:
      v1:
        name: C_Lalpha
        sample_range:
        - 0.4
        - 0.8
        sample_type:
        - uni
        - pos
      v2:
        name: alpha
        sample_range:
        - 5.0
        - 10.0
        sample_type:
        - uni
        - pos
      v3:
        name: C_Ldelta_e
        sample_range:
        - 0.4
        - 0.8
        sample_type:
        - uni
        - pos
      v4:
        name: delta_e
        sample_range:
        - 5.0
        - 10.0
        sample_type:
        - uni
        - pos
      v5:
        name: S_HT
        sample_range:
        - 1.0
        - 1.5
        sample_type:
        - uni
        - pos
      v6:
        name: S_ref
        sample_range:
        - 5.0
        - 7.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      C_Lalpha: 'U[0.4, 0.8]; uniform on the closed interval [0.4, 0.8] (HL: ValueGenerator.GenerateUniformDistributedValues(seed,
        n, 0.4, 0.8) = r*(end-start)+start with r = NextUInt()/uint.MaxValue in [0, 1], end inclusive; ValueGenerator.cs lines
        32-48). Each input is drawn independently from its own seed (a box).'
      alpha: 'U[5.0, 10.0]; uniform on the closed interval [5.0, 10.0] (HL: ValueGenerator.GenerateUniformDistributedValues(seed,
        n, 5.0, 10.0) = r*(end-start)+start with r = NextUInt()/uint.MaxValue in [0, 1], end inclusive; ValueGenerator.cs
        lines 32-48). Each input is drawn independently from its own seed (a box).'
      C_Ldelta_e: 'U[0.4, 0.8]; uniform on the closed interval [0.4, 0.8] (HL: ValueGenerator.GenerateUniformDistributedValues(seed,
        n, 0.4, 0.8) = r*(end-start)+start with r = NextUInt()/uint.MaxValue in [0, 1], end inclusive; ValueGenerator.cs lines
        32-48). Each input is drawn independently from its own seed (a box).'
      delta_e: 'U[5.0, 10.0]; uniform on the closed interval [5.0, 10.0] (HL: ValueGenerator.GenerateUniformDistributedValues(seed,
        n, 5.0, 10.0) = r*(end-start)+start with r = NextUInt()/uint.MaxValue in [0, 1], end inclusive; ValueGenerator.cs
        lines 32-48). Each input is drawn independently from its own seed (a box).'
      S_HT: 'U[1.0, 1.5]; uniform on the closed interval [1.0, 1.5] (HL: ValueGenerator.GenerateUniformDistributedValues(seed,
        n, 1.0, 1.5) = r*(end-start)+start with r = NextUInt()/uint.MaxValue in [0, 1], end inclusive; ValueGenerator.cs lines
        32-48). Each input is drawn independently from its own seed (a box).'
      S_ref: 'U[5.0, 7.0]; uniform on the closed interval [5.0, 7.0] (HL: ValueGenerator.GenerateUniformDistributedValues(seed,
        n, 5.0, 7.0) = r*(end-start)+start with r = NextUInt()/uint.MaxValue in [0, 1], end inclusive; ValueGenerator.cs lines
        32-48). Each input is drawn independently from its own seed (a box).'
    meta:
      finite_fraction: 1.0
  FluidDynamics:
    raw: V_inf*r*sin(pi*theta/180.0)*(1 - R**2/r**2) + Gamma/(2*pi)*log(r/R)
    prepared: v1*v3*(1 - v4**2/v3**2)*sin(0.0174532925199433*v2) + 0.1591549430918953*v5*log(v3/v4)
    n_variables: 5
    subset: all
    vars:
      v1:
        name: V_inf
        sample_range:
        - 60.0
        - 65.0
        sample_type:
        - uni
        - pos
      v2:
        name: theta
        sample_range:
        - 30.0
        - 40.0
        sample_type:
        - uni
        - pos
      v3:
        name: r
        sample_range:
        - 0.5
        - 0.8
        sample_type:
        - uni
        - pos
      v4:
        name: R
        sample_range:
        - 0.2
        - 0.5
        sample_type:
        - uni
        - pos
      v5:
        name: Gamma
        sample_range:
        - 5.0
        - 10.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      V_inf: 'U[60.0, 65.0]; uniform on the closed interval [60.0, 65.0] (HL: ValueGenerator.GenerateUniformDistributedValues(seed,
        n, 60.0, 65.0) = r*(end-start)+start with r = NextUInt()/uint.MaxValue in [0, 1], end inclusive; ValueGenerator.cs
        lines 32-48). Each input is drawn independently from its own seed (a box).'
      theta: 'U[30.0, 40.0]; uniform on the closed interval [30.0, 40.0] (HL: ValueGenerator.GenerateUniformDistributedValues(seed,
        n, 30.0, 40.0) = r*(end-start)+start with r = NextUInt()/uint.MaxValue in [0, 1], end inclusive; ValueGenerator.cs
        lines 32-48). Each input is drawn independently from its own seed (a box).'
      r: 'U[0.5, 0.8]; uniform on the closed interval [0.5, 0.8] (HL: ValueGenerator.GenerateUniformDistributedValues(seed,
        n, 0.5, 0.8) = r*(end-start)+start with r = NextUInt()/uint.MaxValue in [0, 1], end inclusive; ValueGenerator.cs lines
        32-48). Each input is drawn independently from its own seed (a box).'
      R: 'U[0.2, 0.5]; uniform on the closed interval [0.2, 0.5] (HL: ValueGenerator.GenerateUniformDistributedValues(seed,
        n, 0.2, 0.5) = r*(end-start)+start with r = NextUInt()/uint.MaxValue in [0, 1], end inclusive; ValueGenerator.cs lines
        32-48). Each input is drawn independently from its own seed (a box).'
      Gamma: 'U[5.0, 10.0]; uniform on the closed interval [5.0, 10.0] (HL: ValueGenerator.GenerateUniformDistributedValues(seed,
        n, 5.0, 10.0) = r*(end-start)+start with r = NextUInt()/uint.MaxValue in [0, 1], end inclusive; ValueGenerator.cs
        lines 32-48). Each input is drawn independently from its own seed (a box).'
    meta:
      finite_fraction: 1.0
  SheetBendingProcess:
    raw: 210000/(210000 + h)*(sigma_y*t**2/(wR*Rt*t) + h*t**3/(3*(Rt*t)*(wR*Rt*t)) - 4*sigma_y**3*(Rt*t)**2/(3*(wR*Rt*t)*210000**2))*(1
      + 4*t/(wR*Rt*t))
    prepared: 210000*(1 + 4/(v4*v5))*(v1*v3/(3*v4**2*v5) - v2**3*v3*v4/(33075000000*v5) + v2*v3/(v4*v5))/(v1 + 210000)
    n_variables: 5
    subset: all
    vars:
      v1:
        name: h
        sample_range:
        - 0.1
        - 5.0
        sample_type:
        - uni
        - pos
      v2:
        name: sigma_y
        sample_range:
        - 250.0
        - 1000.0
        sample_type:
        - uni
        - pos
      v3:
        name: t
        sample_range:
        - 0.5
        - 5.0
        sample_type:
        - uni
        - pos
      v4:
        name: Rt
        sample_range:
        - 1.0
        - 100.0
        sample_type:
        - uni
        - pos
      v5:
        name: wR
        sample_range:
        - 0.5
        - 1.5
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      h: 'U[0.1, 5.0]; uniform on the closed interval [0.1, 5.0] (HL: ValueGenerator.GenerateUniformDistributedValues(seed,
        n, 0.1, 5.0) = r*(end-start)+start with r = NextUInt()/uint.MaxValue in [0, 1], end inclusive; ValueGenerator.cs lines
        32-48). Each input is drawn independently from its own seed (a box).'
      sigma_y: 'U[250.0, 1000.0]; uniform on the closed interval [250.0, 1000.0] (HL: ValueGenerator.GenerateUniformDistributedValues(seed,
        n, 250.0, 1000.0) = r*(end-start)+start with r = NextUInt()/uint.MaxValue in [0, 1], end inclusive; ValueGenerator.cs
        lines 32-48). Each input is drawn independently from its own seed (a box).'
      t: 'U[0.5, 5.0]; uniform on the closed interval [0.5, 5.0] (HL: ValueGenerator.GenerateUniformDistributedValues(seed,
        n, 0.5, 5.0) = r*(end-start)+start with r = NextUInt()/uint.MaxValue in [0, 1], end inclusive; ValueGenerator.cs lines
        32-48). Each input is drawn independently from its own seed (a box).'
      Rt: 'U[1.0, 100.0]; uniform on the closed interval [1.0, 100.0] (HL: ValueGenerator.GenerateUniformDistributedValues(seed,
        n, 1.0, 100.0) = r*(end-start)+start with r = NextUInt()/uint.MaxValue in [0, 1], end inclusive; ValueGenerator.cs
        lines 32-48). Each input is drawn independently from its own seed (a box).'
      wR: 'U[0.5, 1.5]; uniform on the closed interval [0.5, 1.5] (HL: ValueGenerator.GenerateUniformDistributedValues(seed,
        n, 0.5, 1.5) = r*(end-start)+start with r = NextUInt()/uint.MaxValue in [0, 1], end inclusive; ValueGenerator.cs lines
        32-48). Each input is drawn independently from its own seed (a box).'
    meta:
      finite_fraction: 1.0
