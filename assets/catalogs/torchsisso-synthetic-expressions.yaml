        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x1: uniform U[1,5]
      x2: uniform U[1,5]
    meta:
      finite_fraction: 1.0
  '3':
    raw: 3*exp(x1)/(x2 + exp(x3))
    prepared: 3*exp(v1)/(v2 + exp(v3))
    n_variables: 3
