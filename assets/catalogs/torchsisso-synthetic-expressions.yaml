metadata:
  name: torchsisso-synthetic-expressions
  version: 1
  tags: {"origin": "classic benchmark", "tags": []}
  description: TorchSISSO synthetic expressions
  sources:
  - https://arxiv.org/abs/2410.01752
  - https://arxiv.org/e-print/2410.01752v2
  - https://arxiv.org/e-print/2410.01752v1
  - https://doi.org/10.1016/j.dche.2024.100198
  - https://github.com/PaulsonLab/TorchSISSO
  - https://colab.research.google.com/drive/1q0TEEALkb1PzJuusGKyHphv7tfod66XA
  - https://colab.research.google.com/drive/1ObQJJXTpz5l04pphSH1nHT-Rsd2zBszC
  - https://arxiv.org/e-print/2502.03367
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-114.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  '1':
    raw: 10*x1/(x2*(x3+x4))
    prepared: 10*v1/(v2*(v3 + v4))
    n_variables: 4
    subset: all
    vars:
      v1:
        name: x1
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v2:
        name: x2
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v3:
        name: x3
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v4:
        name: x4
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x1: uniform U[1,5]
      x2: uniform U[1,5]
      x3: uniform U[1,5]
      x4: uniform U[1,5]
    meta:
      finite_fraction: 1.0
  '2':
    raw: 2*sin(x2) + 3*sqrt(x1)
    prepared: 3*sqrt(v1) + 2*sin(v2)
    n_variables: 2
    subset: all
