metadata:
  name: keijzer
  version: 2
  tags: {"origin": "classic benchmark", "tags": []}
  license: "BSD-3-Clause (dso-org/deep-symbolic-optimization benchmarks.csv); formulas and ranges as in each benchmark's first publication (facts)"
  citation: {"paper": {"short": "Keijzer 2003", "title": "Improving Symbolic Regression with Interval Arithmetic and Linear Scaling", "venue": "Genetic Programming, Lecture Notes in Computer Science, pp. 70-82", "url": "https://doi.org/10.1007/3-540-36599-0_7"}, "data": {"short": "GitHub dso-org/deep-symbolic-optimization@2069d4e", "title": "DSO benchmark registry benchmarks.csv (uDSR release 2069d4e, BSD-3-Clause)", "url": "https://github.com/dso-org/deep-symbolic-optimization/blob/2069d4eda47b0fd6d3e66e0ade9605cd9574b87c/dso/dso/task/regression/benchmarks.csv"}}
  companion: "keijzer-points: Keijzer-1, Keijzer-2, Keijzer-3, Keijzer-4, Keijzer-6, Keijzer-7, Keijzer-8, Keijzer-9, the authors pinned points (a data catalog)"
  description: Keijzer symbolic-regression suite.
  sources:
  - Keijzer 2003 (EuroGP), interval arithmetic + linear scaling
  - formulas + ranges from dso-org/deep-symbolic-optimization benchmarks.csv (BSD-3;
    Petersen et al. 2021, Mundhenk et al. 2021)
  sampling_defaults:
    n_points: 20
    method: random
    noise: 0.0
  source_kind: set
  conventions:
    sampling: vars use the `fastsrb` distribution (sample_range/sample_type); DSO
      train_spec ranges; evenly-spaced (E) upstream grids are sampled uniformly here
      (noted per entry as meta.dso_spec).
    validity: 'accepted points follow the declared per-variable distribution CONDITIONED
      on the expression''s valid domain; meta.finite_fraction is the MC-estimated
      per-point valid fraction (n=20000); entries below 0.05 carry low_validity: true
      and need per-entry review.'
expressions:
  Keijzer-5:
    raw: 30*x*z/((x - 10)*y**2)
    prepared: 30*v1*v3/(v2**2*(v1 - 10))
    n_variables: 3
    sources:
    - Keijzer 2003 (EuroGP), interval arithmetic + linear scaling
    - formulas + ranges from dso-org/deep-symbolic-optimization benchmarks.csv (BSD-3;
      Petersen et al. 2021, Mundhenk et al. 2021)
    vars:
      v1:
        name: x1
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v2:
        name: x2
        sample_range:
        - 1.0
        - 2.0
        sample_type:
        - uni
        - pos
      v3:
        name: x3
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    source_audit: the authors' definition (catalog-prep fresh-10) replaces the DSO transcription
    meta:
      finite_fraction: 1.0
  Keijzer-10:
    raw: pow(x1,x2)
    prepared: ((v1)**(v2))
    n_variables: 2
    sources:
    - Keijzer 2003 (EuroGP), interval arithmetic + linear scaling
    - formulas + ranges from dso-org/deep-symbolic-optimization benchmarks.csv (BSD-3;
      Petersen et al. 2021, Mundhenk et al. 2021)
    vars:
      v1:
        name: x1
        sample_range:
        - 0.0
        - 1.0
        sample_type:
        - uni
        - pos
      v2:
        name: x2
        sample_range:
        - 0.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    meta:
      dso_spec:
        train:
          all:
            U:
            - 0
            - 1
            - 100
        test:
          all:
            E:
            - 0
            - 1
            - 0.01
        function_set: Keijzer
      finite_fraction: 1.0
    test:
      vars:
        v1:
          dist:
            name: grid
            kwargs:
              low: 0.0
              high: 1.0
              step: 0.01
        v2:
          dist:
            name: grid
            kwargs:
              low: 0.0
              high: 1.0
              step: 0.01
    test_source: 'M. Keijzer, EuroGP 2003, author preprint p. 9 Table 3 (page crop catalog-prep/raw/fresh-10/keijzer2003_p9_table3.png,
      opened); caption: ''The training and testing ranges are denoted using [start:step:stop]
      notation when the set is created using regular intervals. The notation rnd(min,max)
      defines random (uniform) sampling in the range, while the mesh([start:step:stop])
      defines regular sampling in t'
  Keijzer-11:
    raw: x1*x2+sin((x1-1)*(x2-1))
    prepared: v1*v2+sin((v1-1)*(v2-1))
    n_variables: 2
    sources:
    - Keijzer 2003 (EuroGP), interval arithmetic + linear scaling
    - formulas + ranges from dso-org/deep-symbolic-optimization benchmarks.csv (BSD-3;
      Petersen et al. 2021, Mundhenk et al. 2021)
    vars:
      v1:
        name: x1
        sample_range:
        - -3.0
        - 3.0
        sample_type:
        - uni
        - pos
      v2:
        name: x2
        sample_range:
        - -3.0
        - 3.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    meta:
      dso_spec:
        train:
          all:
            U:
            - -3
            - 3
            - 20
        test:
          all:
            E:
            - -3
            - 3
            - 0.01
        function_set: Keijzer
      finite_fraction: 1.0
    test:
      vars:
        v1:
          dist:
            name: grid
            kwargs:
              low: -3.0
              high: 3.0
              step: 0.01
        v2:
          dist:
            name: grid
            kwargs:
              low: -3.0
              high: 3.0
              step: 0.01
    test_source: 'M. Keijzer, EuroGP 2003, author preprint p. 9 Table 3 (page crop catalog-prep/raw/fresh-10/keijzer2003_p9_table3.png,
      opened); caption: ''The training and testing ranges are denoted using [start:step:stop]
      notation when the set is created using regular intervals. The notation rnd(min,max)
      defines random (uniform) sampling in the range, while the mesh([start:step:stop])
      defines regular sampling in t'
