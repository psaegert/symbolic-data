metadata:
  name: symtree-benchmark-functions
  version: 1
  tags: {"origin": "classic benchmark", "tags": []}
  license: "facts only: functions and ranges cited from de Franca 2018 (Inf. Sci. 442:18, arXiv:1801.01807) and the original Kattan et al. papers; no upstream license"
  citation: {"paper": {"short": "Olivetti de França 2018", "title": "A greedy search tree heuristic for symbolic regression", "venue": "Information Sciences 442-443:18-32", "url": "https://doi.org/10.1016/j.ins.2018.02.040"}}
  description: SymTree benchmark functions
  sources:
  - https://arxiv.org/abs/1801.01807
  - https://doi.org/10.1016/j.ins.2018.02.040
  - https://github.com/folivetti/ITSR/tree/5f0e808ef4daa28ecd6b0529d5854c4f975796a9
  - https://github.com/folivetti/ITSR/blob/5f0e808ef4daa28ecd6b0529d5854c4f975796a9/Datasets/SymtreeFFX/genpoly.py
  - https://github.com/folivetti/ITSR/blob/5f0e808ef4daa28ecd6b0529d5854c4f975796a9/SymTree/Python/Benchmark.ipynb
  - https://github.com/folivetti/ITSR/tree/5f0e808ef4daa28ecd6b0529d5854c4f975796a9/Datasets/Symtree
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-141.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  F1:
    raw: x**3 + x**2 + 5*x
    prepared: v1**3 + v1**2 + 5*v1
    n_variables: 1
    subset: all
    vars:
      v1:
        name: x
        sample_range:
        - -5.0
        - 5.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x: uniform U[-5,5]
    meta:
      finite_fraction: 1.0
  F2:
    raw: x**4 + x**3 + x**2 + x
    prepared: v1**4 + v1**3 + v1**2 + v1
    n_variables: 1
    subset: all
    vars:
      v1:
        name: x
        sample_range:
        - -5.0
