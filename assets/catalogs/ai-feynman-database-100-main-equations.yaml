        expr: v/c
      v2:
        name: var2
        expr: u/c
      v0:
        name: y
    input_distributions:
      var1: 'not given by the authors; derived: var1 = v/c with c ~ U[1,5], v ~ U[1,5] (FeynmanEquations.csv ranges), i.e.
