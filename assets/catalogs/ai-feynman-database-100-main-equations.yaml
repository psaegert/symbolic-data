      var2: 'not given by the authors; derived: var2 = t*u/x with x ~ U[5,10], u ~ U[1,2], t ~ U[1,2] (FeynmanEquations.csv
        ranges), i.e. a push-forward of the with-units uniforms, jointly with the other groups'
    latent:
      u:
        sample_range:
