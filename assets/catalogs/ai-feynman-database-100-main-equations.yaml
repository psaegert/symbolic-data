metadata:
  name: ai-feynman-database-100-main-equations
  version: 1
  tags: {"origin": "science formula", "tags": []}
  license: "facts only: formulas, ranges and units cited from the Feynman Symbolic Regression Database (Udrescu & Tegmark 2020, Sci. Adv. 6:eaay2631); no upstream license"
  description: 'AI Feynman database: 100 main equations (FSReD)'
  sources:
  - https://arxiv.org/abs/1905.11481
  - https://doi.org/10.1126/sciadv.aay2631
  - https://web.archive.org/web/2022id_/https://space.mit.edu/home/tegmark/main_aifeynman.html
  - https://github.com/samholt/DeepGenerativeSymbolicRegression/blob/5322ec8a446cf75e96ec9b3bb904f4d1970eff1e/datasets/FeynmanEquationsDimensionless.csv
  - https://github.com/intell-sci-comput/PSE/blob/9a7d5711152a89abbac0328faa2f440cc5498fb5/baselines/algorithms/DGSR/datasets/FeynmanEquationsDimensionless.csv
  - https://web.archive.org/web/2022id_/https://space.mit.edu/home/tegmark/aifeynman/FeynmanEquations.csv
  - https://github.com/WassimTenachi/PhySO/blob/04c7bb9535f1fdde9acaec7c8e273a3a9f694ab4/physo/benchmark/FeynmanDataset/units.csv
  - https://github.com/SJ001/AI-Feynman/blob/a05bc4a5be23d6eb3e1d0b2f7eb1ab5b78a920ad/aifeynman/dimensionalAnalysis.py
  - https://www.dropbox.com/s/9i05v6yw1kbkup3/Feynman_without_units.tar.gz
  - https://www.dropbox.com/s/7kgfr00qpokgz8w/Feynman_with_units.tar.gz
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/interrupted-3.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  I.6.2a:
    raw: sqrt(2)*exp(-var1**2/2)/(2*sqrt(pi))
    prepared: sqrt(2)*(1/(2*sqrt(3.141592653589793)))*exp(-v1**2/2)
    n_variables: 1
    subset: all
    vars:
      v1:
        name: var1
        sample_range:
        - 1.0
        - 3.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      var1: uniform U[1,3] (the with-units input theta, FeynmanEquations.csv)
    meta:
      finite_fraction: 1.0
  I.6.2:
    raw: sqrt(2)*exp(-var2**2/(2*var1**2))/(2*sqrt(pi)*var1)
    prepared: sqrt(2)*exp(-v2**2/(2*v1**2))/(2*sqrt(3.141592653589793)*v1)
    n_variables: 2
    subset: all
    vars:
      v1:
        name: var1
        sample_range:
        - 1.0
        - 3.0
        sample_type:
        - uni
        - pos
      v2:
        name: var2
        sample_range:
        - 1.0
        - 3.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      var1: uniform U[1,3] (the with-units input sigma, FeynmanEquations.csv)
      var2: uniform U[1,3] (the with-units input theta, FeynmanEquations.csv)
    meta:
      finite_fraction: 1.0
  I.6.2b:
    raw: sqrt(2)*exp(-(var2 - var3)**2/(2*var1**2))/(2*sqrt(pi)*var1)
    prepared: sqrt(2)*exp(-(v2 - v3)**2/(2*v1**2))/(2*sqrt(3.141592653589793)*v1)
    n_variables: 3
    subset: all
    vars:
      v1:
        name: var1
        sample_range:
        - 1.0
        - 3.0
        sample_type:
        - uni
        - pos
      v2:
        name: var2
        sample_range:
        - 1.0
        - 3.0
        sample_type:
        - uni
        - pos
      v3:
        name: var3
        sample_range:
        - 1.0
        - 3.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      var1: uniform U[1,3] (the with-units input sigma, FeynmanEquations.csv)
      var2: uniform U[1,3] (the with-units input theta, FeynmanEquations.csv)
      var3: uniform U[1,3] (the with-units input theta1, FeynmanEquations.csv)
    meta:
      finite_fraction: 1.0
  I.8.14:
    raw: sqrt((var1 - 1)**2 + (-var2 + var3)**2)
    prepared: sqrt((v1 - 1)**2 + (-v2 + v3)**2)
    n_variables: 3
    subset: all
    vars:
      v1:
        name: var1
        expr: x2/x1
      v2:
        name: var2
        expr: y1/x1
      v3:
        name: var3
        expr: y2/x1
      v0:
        name: y
    input_distributions:
      var1: 'not given by the authors; derived: var1 = x2/x1 with x1 ~ U[1,5], x2 ~ U[1,5] (FeynmanEquations.csv ranges),
        i.e. a push-forward of the with-units uniforms, jointly with the other groups'
      var2: 'not given by the authors; derived: var2 = y1/x1 with x1 ~ U[1,5], y1 ~ U[1,5] (FeynmanEquations.csv ranges),
        i.e. a push-forward of the with-units uniforms, jointly with the other groups'
      var3: 'not given by the authors; derived: var3 = y2/x1 with x1 ~ U[1,5], y2 ~ U[1,5] (FeynmanEquations.csv ranges),
        i.e. a push-forward of the with-units uniforms, jointly with the other groups'
    latent:
      x1:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      x2:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      y1:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      y2:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
    meta:
      finite_fraction: 1.0
  I.9.18:
    raw: var1/((var2 - 1)**2 + (-var3 + var4)**2 + (-var5 + var6)**2)
    prepared: v1/((v2 - 1)**2 + (-v3 + v4)**2 + (-v5 + v6)**2)
    n_variables: 6
    subset: all
    vars:
      v1:
        name: var1
        expr: m2/m1
      v2:
        name: var2
        expr: x2/x1
      v3:
        name: var3
        expr: y1/x1
      v4:
        name: var4
        expr: y2/x1
      v5:
        name: var5
        expr: z1/x1
      v6:
        name: var6
        expr: z2/x1
      v0:
        name: y
    input_distributions:
      var1: 'not given by the authors; derived: var1 = m2/m1 with m1 ~ U[1,2], m2 ~ U[1,2] (FeynmanEquations.csv ranges),
        i.e. a push-forward of the with-units uniforms, jointly with the other groups'
      var2: 'not given by the authors; derived: var2 = x2/x1 with x1 ~ U[3,4], x2 ~ U[1,2] (FeynmanEquations.csv ranges),
        i.e. a push-forward of the with-units uniforms, jointly with the other groups'
      var3: 'not given by the authors; derived: var3 = y1/x1 with x1 ~ U[3,4], y1 ~ U[3,4] (FeynmanEquations.csv ranges),
        i.e. a push-forward of the with-units uniforms, jointly with the other groups'
      var4: 'not given by the authors; derived: var4 = y2/x1 with x1 ~ U[3,4], y2 ~ U[1,2] (FeynmanEquations.csv ranges),
        i.e. a push-forward of the with-units uniforms, jointly with the other groups'
      var5: 'not given by the authors; derived: var5 = z1/x1 with x1 ~ U[3,4], z1 ~ U[3,4] (FeynmanEquations.csv ranges),
        i.e. a push-forward of the with-units uniforms, jointly with the other groups'
      var6: 'not given by the authors; derived: var6 = z2/x1 with x1 ~ U[3,4], z2 ~ U[1,2] (FeynmanEquations.csv ranges),
        i.e. a push-forward of the with-units uniforms, jointly with the other groups'
    latent:
      m1:
        sample_range:
        - 1.0
        - 2.0
        sample_type:
        - uni
        - pos
      m2:
        sample_range:
        - 1.0
        - 2.0
        sample_type:
        - uni
        - pos
      x1:
        sample_range:
        - 3.0
        - 4.0
        sample_type:
        - uni
        - pos
      x2:
        sample_range:
        - 1.0
        - 2.0
        sample_type:
        - uni
        - pos
      y1:
        sample_range:
        - 3.0
        - 4.0
        sample_type:
        - uni
        - pos
      y2:
        sample_range:
        - 1.0
        - 2.0
        sample_type:
        - uni
        - pos
      z1:
        sample_range:
        - 3.0
        - 4.0
        sample_type:
        - uni
        - pos
      z2:
        sample_range:
        - 1.0
        - 2.0
        sample_type:
        - uni
        - pos
    meta:
      finite_fraction: 1.0
  I.10.7:
    raw: 1/sqrt(1 - 1/var1**2)
    prepared: 1/sqrt(1 - 1/v1**2)
    n_variables: 1
    subset: all
    vars:
      v1:
        name: var1
        expr: c/v
      v0:
        name: y
    input_distributions:
      var1: 'not given by the authors; derived: var1 = c/v with v ~ U[1,2], c ~ U[3,10] (FeynmanEquations.csv ranges), i.e.
        a push-forward of the with-units uniforms, jointly with the other groups'
    latent:
      v:
        sample_range:
        - 1.0
        - 2.0
        sample_type:
        - uni
        - pos
      c:
        sample_range:
        - 3.0
        - 10.0
        sample_type:
        - uni
        - pos
    meta:
      finite_fraction: 1.0
  I.11.19:
    raw: var1*var4 + var2*var5 + var3
    prepared: v1*v4 + v2*v5 + v3
    n_variables: 5
    subset: all
    vars:
      v1:
        name: var1
        expr: x2/x1
      v2:
        name: var2
        expr: x3/x1
      v3:
        name: var3
        expr: y1/x1
      v4:
        name: var4
        expr: y2/x1
      v5:
        name: var5
        expr: y3/x1
      v0:
        name: y
    input_distributions:
      var1: 'not given by the authors; derived: var1 = x2/x1 with x1 ~ U[1,5], x2 ~ U[1,5] (FeynmanEquations.csv ranges),
        i.e. a push-forward of the with-units uniforms, jointly with the other groups'
      var2: 'not given by the authors; derived: var2 = x3/x1 with x1 ~ U[1,5], x3 ~ U[1,5] (FeynmanEquations.csv ranges),
        i.e. a push-forward of the with-units uniforms, jointly with the other groups'
      var3: 'not given by the authors; derived: var3 = y1/x1 with x1 ~ U[1,5], y1 ~ U[1,5] (FeynmanEquations.csv ranges),
        i.e. a push-forward of the with-units uniforms, jointly with the other groups'
      var4: 'not given by the authors; derived: var4 = y2/x1 with x1 ~ U[1,5], y2 ~ U[1,5] (FeynmanEquations.csv ranges),
        i.e. a push-forward of the with-units uniforms, jointly with the other groups'
      var5: 'not given by the authors; derived: var5 = y3/x1 with x1 ~ U[1,5], y3 ~ U[1,5] (FeynmanEquations.csv ranges),
        i.e. a push-forward of the with-units uniforms, jointly with the other groups'
    latent:
      x1:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      x2:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      x3:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      y1:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      y2:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      y3:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
    meta:
      finite_fraction: 1.0
  I.12.1:
    raw: var1
    prepared: v1
    n_variables: 1
    subset: all
    vars:
      v1:
        name: var1
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      var1: uniform U[1,5] (the with-units input mu, FeynmanEquations.csv)
    meta:
      finite_fraction: 1.0
  I.13.4:
    raw: var1**2/2 + var2**2/2 + 1/2
    prepared: v1**2/2 + v2**2/2 + 1/2
    n_variables: 2
    subset: all
    vars:
      v1:
        name: var1
        expr: u/v
      v2:
        name: var2
        expr: w/v
      v0:
        name: y
    input_distributions:
      var1: 'not given by the authors; derived: var1 = u/v with v ~ U[1,5], u ~ U[1,5] (FeynmanEquations.csv ranges), i.e.
        a push-forward of the with-units uniforms, jointly with the other groups'
      var2: 'not given by the authors; derived: var2 = w/v with v ~ U[1,5], w ~ U[1,5] (FeynmanEquations.csv ranges), i.e.
        a push-forward of the with-units uniforms, jointly with the other groups'
    latent:
      v:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      u:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      w:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
    meta:
      finite_fraction: 1.0
  I.12.2:
    raw: var1/(4*pi)
    prepared: (1/(4*3.141592653589793))*v1
    n_variables: 1
    subset: all
    vars:
      v1:
        name: var1
        expr: q2/q1
      v0:
        name: y
    input_distributions:
      var1: 'not given by the authors; derived: var1 = q2/q1 with q1 ~ U[1,5], q2 ~ U[1,5] (FeynmanEquations.csv ranges),
