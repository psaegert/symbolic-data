        - pos
      m2:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      r1:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      r2:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
    meta:
      finite_fraction: 1.0
  I.15.3x:
    raw: (1 - var2)/sqrt(1 - 1/var1**2)
    prepared: (1 - v2)/sqrt(1 - 1/v1**2)
    n_variables: 2
    subset: all
    vars:
      v1:
        name: var1
