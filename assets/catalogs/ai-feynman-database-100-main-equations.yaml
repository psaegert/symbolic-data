  I.13.12:
    raw: var1*(-1 + 1/var2)
    prepared: v1*(-1 + 1/v2)
    n_variables: 2
    subset: all
    vars:
      v1:
        name: var1
        expr: m2/m1
      v2:
        name: var2
        expr: r2/r1
