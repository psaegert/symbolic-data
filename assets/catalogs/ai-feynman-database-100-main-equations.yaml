        - 5.0
        sample_type:
        - uni
        - pos
      q2:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
    meta:
      finite_fraction: 1.0
  I.12.11:
    raw: var1*sin(var2) + 1
    prepared: v1*sin(v2) + 1
    n_variables: 2
    subset: all
    vars:
      v1:
        name: var1
        expr: B*v/Ef
      v2:
        name: var2
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      var1: 'not given by the authors; derived: var1 = B*v/Ef with Ef ~ U[1,5], B ~ U[1,5], v ~ U[1,5] (FeynmanEquations.csv
        ranges), i.e. a push-forward of the with-units uniforms, jointly with the other groups'
      var2: uniform U[1,5] (the with-units input theta, FeynmanEquations.csv)
    latent:
      Ef:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      B:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
