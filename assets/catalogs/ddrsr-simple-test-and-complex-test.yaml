        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x1: 'not given: the authors give only the range ''(0,1)'' for every variable (Table 4, General, ''variable sample range
        (0,1)''); no distribution named, uniform U(0,1) is the natural reading'
      x2: 'not given: the authors give only the range ''(0,1)'' for every variable (Table 4, General, ''variable sample range
