metadata:
  name: ddrsr-simple-test-and-complex-test
  version: 1
  tags: {"origin": "classic benchmark", "tags": []}
  description: DDRSR simple_test and complex-test
  sources:
  - https://arxiv.org/abs/2608.02628
  - https://arxiv.org/pdf/2608.02628v3
  - https://arxiv.org/pdf/2608.02628v1
  - https://arxiv.org/pdf/2608.02628v2
  - https://arxiv.org/e-print/2608.02628v3
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-105.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
