metadata:
  name: kan-feynman-no-units-subset
  display_name: "kan-feynman-no-units-subset*"
  version: 2
  benchmark: "kan-feynman-no-units-subset"
  tags: {"origin": "science formula", "tags": ["srbf-modified"]}
  license: "CC BY 4.0 (Liu et al. 2024, KAN, arXiv:2404.19756, Table 2)"
  citation: {"paper": {"short": "Liu et al. 2025", "title": "KAN: Kolmogorov-Arnold Networks", "venue": "ICLR 2025", "url": "https://arxiv.org/abs/2404.19756"}}
  srbf_changes: [{"kind": "filled", "problems": 20, "text": "The authors give no input range for 20 of the 27 formulas (the paper states one only for I.16.6; its author points to the AI Feynman database). srbf draws each dimensionless input as the paper's Table 2 reduces it from AI Feynman's dimensional variables (e.g. a = m2/m1), those drawn on AI Feynman's ranges (a push-forward)."}]
  srbf_notes: ["Paper and code differ: I.16.6 draws a = u/c and b = v/c as in the AI Feynman without-units data the authors point to (u, v and c on [1, 5]); the paper states (-1, 1)."]
  description: KAN Feynman_no_units subset
  sources:
  - https://arxiv.org/abs/2404.19756
  - https://arxiv.org/e-print/2404.19756v5
  - https://github.com/KindXiaoming/pykan (kan/utils.py create_dataset; kan/feynman.py; HEAD ecde4ec3274d3bef1ad737479cf126aed38ab530)
  - https://github.com/KindXiaoming/pykan/issues/377
  - https://github.com/KindXiaoming/pykan/issues/549
  - https://raw.githubusercontent.com/samholt/DeepGenerativeSymbolicRegression/master/datasets/FeynmanEquationsDimensionless.csv
  - https://raw.githubusercontent.com/samholt/DeepGenerativeSymbolicRegression/master/datasets/FeynmanEquations.csv
  - https://www.dropbox.com/s/9i05v6yw1kbkup3/Feynman_without_units.tar.gz?dl=0
  - https://arxiv.org/abs/2511.08570
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  conventions:
    rules: 'srbf formula catalogs: the benchmark''s formulas, constants and input distributions; srbf draws the points (512
      to fit, 512 to test) and sets the noise; a value the authors draw anew for every run (a constant, an input''s range)
      is drawn with the points (the entry''s per_run block); srbf''s release freezes one draw per problem'
expressions:
  I.16.6:
    raw: (a+b)/(1+a*b)
    prepared: (v1 + v2)/(v1*v2 + 1)
    n_variables: 2
    subset: all
    vars:
      v1:
        name: a
        expr: u/c
      v2:
        name: b
        expr: v/c
      v0:
        name: y
    input_distributions:
      a: 'derived: a = u/c with u ~ U[1, 5], c ~ U[1, 5] (the AI Feynman without-units data the authors point to; the paper
        states (-1, 1))'
      b: 'derived: b = v/c with v ~ U[1, 5], c ~ U[1, 5] (the AI Feynman without-units data the authors point to; the paper
        states (-1, 1))'
    latent:
      u:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      c:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
      v:
        sample_range:
        - 1.0
        - 5.0
        sample_type:
        - uni
        - pos
    meta:
      finite_fraction: 1.0
