metadata:
  name: ai-hilbert-problem-set
  version: 1
  tags: {"origin": "science formula", "tags": []}
  license: "MIT (IBM/AI-Hilbert)"
  description: AI Hilbert problem set
  sources:
  - https://arxiv.org/abs/2308.09474v3
  - https://doi.org/10.1038/s41467-024-50074-w
  - https://www.nature.com/articles/s41467-024-50074-w
  - https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41467-024-50074-w/MediaObjects/41467_2024_50074_MOESM1_ESM.pdf
  - https://github.com/IBM/AI-Hilbert/tree/621b08ba666d30b374ca70f2c12752e6b59c995f
  - https://github.com/IBM/AI-Hilbert/blob/621b08ba666d30b374ca70f2c12752e6b59c995f/data_generation/data_gen_mix.py
  - https://github.com/IBM/AI-Hilbert/blob/621b08ba666d30b374ca70f2c12752e6b59c995f/data_generation/data_gen_kepler.py
  - https://github.com/IBM/AI-Hilbert/blob/621b08ba666d30b374ca70f2c12752e6b59c995f/main_problems/hagen_einstein_kepler%5B3.3%5D%5B3.5%5D%5B3.6%5D.ipynb
  - https://github.com/IBM/AI-Hilbert/blob/621b08ba666d30b374ca70f2c12752e6b59c995f/main_problems/kepler_with_missing_axioms%5B3.7%5D/data_kepler.dat
  - https://doi.org/10.5281/zenodo.11453179
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-4.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  hagen_poiseuille:
    raw: -Delta_p*(r**2 - R**2)/(4*L*mu)
    prepared: -v1*(-v4**2 + v5**2)/(4*v2*v3)
    n_variables: 5
    subset: all
    vars:
      v1:
        name: Delta_p
        sample_range:
        - 0.5
        - 2.0
        sample_type:
        - uni
        - pos
      v2:
        name: L
        sample_range:
        - 0.5
        - 2.0
        sample_type:
        - uni
        - pos
      v3:
        name: mu
        sample_range:
        - 0.5
        - 2.0
        sample_type:
        - uni
        - pos
      v4:
        name: R
        expr: R
      v5:
        name: r
        expr: 0.0 + u_r * ((R) - 0.0)
      v0:
        name: y
    input_distributions:
      Delta_p: U[0.5, 2.0]
      L: U[0.5, 2.0]
      mu: U[0.5, 2.0]
      R: U[0.5, 5.0]
      r: U[0, R], drawn conditionally on R (r = np.random.uniform(low=0, high=rad))
    latent:
      R:
        sample_range:
        - 0.5
        - 5.0
        sample_type:
        - uni
        - pos
      u_r:
        sample_range:
        - 0.0
        - 1.0
        sample_type:
        - uni
        - pos
    meta:
      finite_fraction: 1.0
  gw_power:
    raw: -32*G**4*(m1*m2)**2*(m1 + m2)/(5*c**5*r**5)
    prepared: -6.4*v1**2*v2**2*(v1 + v2)/v3**5
    n_variables: 3
    subset: all
    vars:
      v1:
        name: m1
        sample_range:
        - 0.5
        - 2.0
        sample_type:
        - uni
        - pos
      v2:
        name: m2
        sample_range:
        - 0.5
        - 2.0
        sample_type:
        - uni
        - pos
      v3:
        name: r
        sample_range:
        - 0.5
        - 2.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      m1: U[0.5, 2.0]
      m2: U[0.5, 2.0]
      r: U[0.5, 2.0]
    meta:
      finite_fraction: 1.0
  kepler_missing_axioms:
    raw: sqrt(d**3/(m1 + m2))
    prepared: sqrt(v3**3/(v1 + v2))
    n_variables: 3
    subset: all
    vars:
      v1:
        name: m1
        sample_range:
        - 0.5
        - 3.0
        sample_type:
        - uni
        - pos
      v2:
        name: m2
        sample_range:
        - 0.5
        - 3.0
        sample_type:
        - uni
        - pos
      v3:
        name: d
        sample_range:
        - 30.0
        - 150.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      m1: U[0.5, 3.0]
      m2: U[0.5, 3.0]
      d: U[30.0, 150.0]
    meta:
      finite_fraction: 1.0
  inelastic_collision:
    raw: 16*m*v_c*c/(3*sqrt(c**2 - v_c**2))
    prepared: 5.33333333333333*v1*v2/sqrt(1.0 - v2**2)
    n_variables: 2
    subset: all
    vars:
      v1:
        name: m
        sample_range:
        - 0.5
        - 2.0
        sample_type:
        - uni
        - pos
      v2:
        name: v_c
        sample_range:
        - 0.5
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      m: U[0.5, 2.0]
      v_c: U[0.5, 1.0) (np.random.uniform, upper end open)
    meta:
      finite_fraction: 1.0
  pion_decay:
    raw: (m_pi**2 - m_mu**2)/(2*m_pi)
    prepared: (v1**2 - v2**2)/(2*v1)
    n_variables: 2
    subset: all
    vars:
      v1:
        name: m_pi
        sample_range:
        - 0.5
        - 2.0
        sample_type:
        - uni
        - pos
      v2:
        name: m_mu
        sample_range:
        - 0.5
        - 2.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      m_pi: U[0.5, 2.0]
      m_mu: U[0.5, 2.0]
    meta:
      finite_fraction: 1.0
  radiation_damping:
    raw: (4/3)*pi*q_c**2*x_0**2*w**4
    prepared: 4*3.141592653589793*v1**2*v2**2*v3**4/3
    n_variables: 3
    subset: all
    vars:
      v1:
        name: q_c
        sample_range:
        - 0.5
        - 2.0
        sample_type:
        - uni
        - pos
      v2:
        name: x_0
        sample_range:
        - 0.5
        - 2.0
        sample_type:
        - uni
        - pos
      v3:
        name: w
        sample_range:
        - 0.5
        - 2.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      q_c: U[0.5, 2.0]
      x_0: U[0.5, 2.0]
      w: U[0.5, 2.0]
    meta:
      finite_fraction: 1.0
  escape_velocity:
    raw: sqrt(2*G*M/r)
    prepared: 1.4142135623731*sqrt(v1/v2)
    n_variables: 2
    subset: all
    vars:
      v1:
        name: M
        sample_range:
        - 0.5
        - 2.0
        sample_type:
        - uni
        - pos
      v2:
        name: r
        sample_range:
        - 0.5
        - 2.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      M: U[0.5, 2.0]
      r: U[0.5, 2.0]
    meta:
      finite_fraction: 1.0
  hall_effect:
    raw: h*L*I_cur*B/(N_e*q_e)
    prepared: v1*v2*v3*v4/(v5*v6)
    n_variables: 6
    subset: all
    vars:
      v1:
        name: h
        sample_range:
        - 0.5
        - 2.0
        sample_type:
        - uni
        - pos
      v2:
        name: L
        sample_range:
        - 0.5
        - 2.0
        sample_type:
        - uni
        - pos
      v3:
        name: I_cur
        sample_range:
        - 0.5
        - 2.0
        sample_type:
        - uni
        - pos
      v4:
        name: B
        sample_range:
        - 0.5
        - 2.0
        sample_type:
        - uni
        - pos
      v5:
        name: N_e
        sample_range:
        - 0.5
        - 2.0
        sample_type:
        - uni
        - pos
      v6:
        name: q_e
        sample_range:
        - 0.5
        - 2.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      h: U[0.5, 2.0]
      L: U[0.5, 2.0]
      I_cur: U[0.5, 2.0]
      B: U[0.5, 2.0]
      N_e: U[0.5, 2.0]
      q_e: U[0.5, 2.0]
    meta:
      finite_fraction: 1.0
  compton_scattering:
    raw: lambda_1 + h*(1 - cos_t)/(m_e*c)
    prepared: v1 - 1.0*v2 + 1.0
    n_variables: 2
    subset: all
    vars:
      v1:
        name: lambda_1
        sample_range:
        - 0.5
        - 2.0
        sample_type:
        - uni
        - pos
      v2:
        name: cos_t
        sample_range:
        - 0.05
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      lambda_1: U[0.5, 2.0]
      cos_t: U[0.05, 1.0]
    meta:
      finite_fraction: 1.0
