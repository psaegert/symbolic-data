metadata:
  name: sym-q-ai-feynman-with-drift-terms
  version: 1
  tags: {"origin": "science formula", "tags": []}
  description: Sym-Q AI-Feynman with drift terms
  sources:
  - 'https://arxiv.org/abs/2402.05306 (Sym-Q; v2 PDF https://arxiv.org/pdf/2402.05306v2: drift text p.8-9, Fig. 4 p.10, Table
    C5 p.28, Table C10 p.30, Table F11 p.34)'
  - 'https://www.nature.com/articles/s41467-025-59288-y (Nat. Commun. 16:3930, PDF .pdf: drift text p.5, Data/Code availability
    p.10, "setup described by Li et al." p.4)'
  - 'https://openreview.net/forum?id=ULzyv9M1j5 (T-JSL, ICLR 2023; PDF via http://web.archive.org/web/20230314215653id_/https://openreview.net/pdf?id=ULzyv9M1j5:
    Sec. 4 p.8, Table 2 p.8, Fig. 6 caption p.9, App. B Table 4 p.12-13, App. E Table 8 p.15)'
  - https://github.com/AILWQ/Joint_Supervised_Learning_for_SR/blob/a7d1f841255bfa61d6000798b65906f95f1a3801/Inference/fit_func_single.py
    (lines 61-66, 110-122, 136; file unchanged since init commit 45d143e, 2022-09-29)
  - https://github.com/AILWQ/Joint_Supervised_Learning_for_SR/blob/a7d1f841255bfa61d6000798b65906f95f1a3801/src/utils.py (generateDataFast,
    lines 91-141)
  - https://github.com/AILWQ/Joint_Supervised_Learning_for_SR/blob/a7d1f841255bfa61d6000798b65906f95f1a3801/config.yaml (fun_support
    min -10 / max 10)
  - https://github.com/EPFL-IMOS/Sym-Q/blob/104a486070f615cd4fdb93a0e95adfd59625ee64/utils.py (BENCHMARK, lines 72-83) and
    /symq_v2/util.py (line 99 ff.)
  - 'https://github.com/EPFL-IMOS/Sym-Q/blob/104a486070f615cd4fdb93a0e95adfd59625ee64/beam_search.py (lines 218-235: fix_seed(0),
    generateDataFast(..., 100, 2, 8, -10, 10))'
  - 'https://doi.org/10.5281/zenodo.15105239 (Sym-Q data: no AIF or drift data)'
  - https://space.mit.edu~/aifeynman.html (base AI-Feynman equations and ranges)
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/interrupted-9.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  Feynman-1:
    raw: exp(-x**2/2)/sqrt(2*pi)
    prepared: 0.3989422804014327*exp(-v1**2/2)
    n_variables: 1
    subset: all
    vars:
      v1:
        name: x
        sample_range:
        - -10.0
        - 10.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x: U[-10, 10]
    meta:
      finite_fraction: 1.0
  Feynman-2:
