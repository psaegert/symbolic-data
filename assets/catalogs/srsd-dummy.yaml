metadata:
  name: srsd-dummy
  version: 2
  tags: {"origin": "science formula", "tags": ["dummy inputs"]}
  license: 'MIT (base laws: viktmar/FastSRB; dummy recipe: omron-sinicx/srsd-benchmark) + CC BY 4.0 (dummy configuration:
    SRSD''s Hugging Face datasets); see THIRD_PARTY_LICENSES'
  description: 'SRSD-Feynman with dummy variables (120): FastSRB''s laws (fastsrb@3) with SRSD''s published dummy columns
    -- the same number, the same column positions and the same per-column law as SRSD''s srsd-feynman_{easy,medium,hard}_dummy
    (1/2/3 dummies on 31/47/42 problems).'
  sources:
  - Feynman Symbolic Regression Database (Udrescu & Tegmark 2020, AI Feynman)
  - SRSD realistic ranges (Matsubara et al. 2024, CC BY 4.0 datasets / MIT code)
  - 'FastSRB (Martinek, arXiv:2508.14481, MIT): base laws from fastsrb.v2.yaml (metadata.version 3, sha256 f7997fb4e979067b)'
  - 'dummy configuration: huggingface.co/datasets/yoshitomo-matsubara/srsd-feynman_easy_dummy @ 67a1cac8420adf421fd0a18d91fbee5f1c0bca2d'
  - 'dummy configuration: huggingface.co/datasets/yoshitomo-matsubara/srsd-feynman_medium_dummy @ e373ffb9b2ee1f46f1eb8204fe35c6abeb589e65'
  - 'dummy configuration: huggingface.co/datasets/yoshitomo-matsubara/srsd-feynman_hard_dummy @ 223c23c15837aa998e43010f125b3da5fd8cb7a8'
  - 'dummy recipe: omron-sinicx/srsd-benchmark @ 7d00b45d56250717ac08a256dc9f79b836d61027 (MIT), dummy_column_mixer.py'
  sampling_defaults:
    n_points: 100
    method: random
    noise: 0.0
  source_kind: set
  conventions:
    sampling: vars use the `fastsrb` distribution (sample_range/sample_type) or `dist`
    dummies: 'a variable named dummy<j> is irrelevant (absent from `prepared`). Its column is SRSD''s published one (supp_info.json
      dummy_vars), and its law is SRSD''s DefaultSampling(10^(k-1), 10^(k+1), uses_negative=u) with k and u read off the published
      rows: sample_type [log, pos_neg] when u, else [log, pos]. Only the configuration is SRSD''s; the rows are drawn fresh
      at evaluation time.'
    oracle_warning: 'adapters must NOT use a used-variable oracle here: variable masking (e.g. PySR padding:false) defeats
      the benchmark; eval configs must disable masking for every method'
    validity: 'accepted points follow the declared per-variable distribution CONDITIONED on the expression''s valid domain;
      meta.finite_fraction is the MC-estimated per-point valid fraction (n=20000); entries below 0.05 carry low_validity:
      true and need per-entry review.'
  changelog:
    '2': rebuilt on fastsrb.v2 (I.29.16 +cos, B6 epsilon unsquared, B7 curvature {-1,0,1}, III.15.27 alpha in +-{1..99}, III.21.20
      rho/q negative, I.44.4 n on [1e24, 1e26], integer inputs on {lo..hi-1} as SRSD's IntegerSampling) with SRSD's published
      dummy columns in place of srsd-dummy@1's re-draw with seed 20260710 (which matched SRSD's dummy count on 41/120, positions
      on 9/120, full configuration on 0/120).
expressions:
  II.38.3:
    sources:
    - Feynman lectures, Feynman Symbolic Regression Benchmark
    - variable sampling ranges from Matsubara et at. 2024
    - moniker generated by ChatGPT
    - 'dummy columns as published by SRSD (Matsubara et al. 2024, ''Rethinking Symbolic Regression Datasets and Benchmarks
      for Scientific Discovery'', DMLR): positions from the Hugging Face datasets'' supp_info.json, laws (k, sign) read off
      the published rows; recipe omron-sinicx/srsd-benchmark dummy_column_mixer.py (MIT), data CC BY 4.0'
    difficulty: easy
    moniker: elastic_force
    raw: Y * A * x / d
    prepared: v2 * v4 * v5 / v7
    accept:
    - ((v2*v4*v5)/v7)
    - (v2*v4*(v5/v7))
    vars:
      v1:
        name: dummy1
        sample_range:
        - 1.0e+28
        - 1.0e+30
        sample_type:
        - log
        - pos
      v2:
        name: Y
        type: (float, positive)
        units:
        - -1
        - -2
        - 1
        - 0
        - 0
        sample_range:
        - 0.1
        - 10.0
        sample_type:
        - log
        - pos
      v3:
        name: dummy2
        sample_range:
        - 1.0e-24
        - 1.0e-22
        sample_type:
        - log
        - pos
      v4:
        name: A
        type: (float, positive)
        units:
        - 2
        - 0
        - 0
        - 0
        - 0
        sample_range:
        - 0.0001
        - 0.01
        sample_type:
        - log
        - pos
      v5:
        name: x
        type: (float)
        units:
        - 1
        - 0
        - 0
        - 0
        - 0
        sample_range:
        - 0.001
        - 0.1
        sample_type:
        - log
        - pos_neg
      v6:
        name: dummy3
        sample_range:
        - 1.0e-15
        - 1.0e-13
        sample_type:
        - log
        - pos
      v7:
        name: d
        type: (float, positive)
        units:
        - 1
        - 0
        - 0
        - 0
        - 0
        sample_range:
        - 0.01
        - 1.0
        sample_type:
        - log
        - pos
      v0:
        name: F
        type: (float)
        units:
        - 1
        - -2
        - 1
        - 0
        - 0
    constraints:
    - v7 != 0
    n_variables: 7
    meta:
      base_catalog: fastsrb@3
      base_eq_id: II.38.3
      srsd_dataset: yoshitomo-matsubara/srsd-feynman_easy_dummy@67a1cac
      srsd_file: feynman-ii.38.3
      n_dummy: 3
      dummy_vars:
      - v1
      - v3
      - v6
      finite_fraction: 1.0
      finite_fraction_source: srsd-dummy@1 (same base law)
  II.38.14:
    sources:
    - Feynman lectures, Feynman Symbolic Regression Benchmark
    - variable sampling ranges from Matsubara et at. 2024
    - moniker generated by ChatGPT
    - 'dummy columns as published by SRSD (Matsubara et al. 2024, ''Rethinking Symbolic Regression Datasets and Benchmarks
      for Scientific Discovery'', DMLR): positions from the Hugging Face datasets'' supp_info.json, laws (k, sign) read off
      the published rows; recipe omron-sinicx/srsd-benchmark dummy_column_mixer.py (MIT), data CC BY 4.0'
    difficulty: easy
    moniker: shear_modulus
    raw: Y / (2 * (1 + sigma))
    prepared: v1 / (2 * (1 + v4))
    accept:
    - (v1/(2.0*(v4+1.0)))
    - (v1/(2.0+(2.0*v4)))
    - ((0.5*v1)/(v4+1.0))
    - (v1/((2.0*v4)+2.0))
    - ((0.5*v1)/(1.0+v4))
    vars:
      v1:
        name: Y
        type: (float, positive)
        units:
        - -1
        - -2
        - 1
        - 0
        - 0
        sample_range:
        - 0.1
        - 10.0
        sample_type:
        - log
        - pos
      v2:
        name: dummy1
        sample_range:
        - 1000.0
        - 100000.0
        sample_type:
        - log
        - pos_neg
      v3:
        name: dummy2
        sample_range:
        - 1.0e-08
        - 1.0e-06
        sample_type:
        - log
        - pos
      v4:
        name: sigma
        type: (float)
        units:
        - 0
        - 0
        - 0
        - 0
        - 0
        sample_range:
        - 0.01
        - 1.0
        sample_type:
        - log
        - pos
      v5:
        name: dummy3
        sample_range:
        - 1.0e-28
        - 1.0e-26
        sample_type:
        - log
        - pos
      v0:
        name: mu_S
        type: (float)
        units:
        - -1
        - -2
        - 1
        - 0
        - 0
    constraints:
    - 1 + v4 != 0
    n_variables: 5
    meta:
      base_catalog: fastsrb@3
      base_eq_id: II.38.14
      srsd_dataset: yoshitomo-matsubara/srsd-feynman_easy_dummy@67a1cac
      srsd_file: feynman-ii.38.14
      n_dummy: 3
      dummy_vars:
      - v2
