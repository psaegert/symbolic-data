  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-159.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  A:
    raw: v0 + a*t
    prepared: v1 + v2*v3
    n_variables: 3
    subset: all
    vars:
      v1:
        name: v0
        sample_range:
        - 0.0
        - 20.0
        sample_type:
        - uni
        - pos
      v2:
        name: a
        sample_range:
        - 5.0
        - 9.0
        sample_type:
        - uni
        - pos
      v3:
        name: t
        sample_range:
        - 0.0
        - 10.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      v0: U[0, 20]
      a: U[5, 9]
      t: U[0, 10]
    meta:
      finite_fraction: 1.0
  E:
    raw: pi*Cd*rhoa*v**2*d**2/8
    prepared: 3.141592653589793*v1*v2*v3**2*v4**2/8
    n_variables: 12
    subset: all
    vars:
      v1:
        name: Cd
        sample_range:
        - 1.0
        - 10.0
        sample_type:
        - uni
        - pos
      v2:
        name: rhoa
        sample_range:
        - 30.0
        - 50.0
        sample_type:
        - uni
        - pos
      v3:
        name: v
        sample_range:
        - 1.0
        - 10.0
        sample_type:
        - uni
        - pos
      v4:
        name: d
        sample_range:
        - 0.01
        - 0.1
        sample_type:
        - uni
        - pos
      v5:
        name: rhop
        sample_range:
        - 0.15
        - 0.24
        sample_type:
        - uni
        - pos
      v6:
        name: L
        sample_range:
        - 0.15
        - 0.4
        sample_type:
        - uni
        - pos
      v7:
        name: p1
        sample_range:
        - 15.0
        - 35.0
        sample_type:
        - uni
        - pos
      v8:
        name: p2
        sample_range:
        - 40.0
        - 60.0
        sample_type:
        - uni
        - pos
      v9:
        name: p3
        sample_range:
        - 0.0001
        - 0.0002
        sample_type:
        - uni
        - pos
      v10:
        name: p4
        sample_range:
        - 200.0
        - 300.0
        sample_type:
        - uni
        - pos
      v11:
        name: p5
        sample_range:
        - 1.0
        - 3.0
        sample_type:
        - uni
        - pos
      v12:
        name: p6
        sample_range:
        - 1000.0
        - 2500.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      Cd: U[1, 10]
      rhoa: U[30, 50]
      v: U[1, 10]
      d: U[0.01, 0.1]
      rhop: U[0.15, 0.24]
      L: U[0.15, 0.4]
      p1: U[15, 35]
      p2: U[40, 60]
      p3: U[0.0001, 0.0002]
      p4: U[200, 300]
      p5: U[1, 3]
      p6: U[1000, 2500]
    meta:
      finite_fraction: 1.0
