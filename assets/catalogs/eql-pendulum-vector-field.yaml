metadata:
  name: eql-pendulum-vector-field
  version: 1
  benchmark: "eql-pendulum-vector-field"
  tags: {"origin": "science formula", "tags": ["extrapolation", "several tests", "dummy inputs"]}
  license: "facts only: formulas and ranges cited from Martius & Lampert 2016 (arXiv:1610.02995); no upstream license"
  citation: {"paper": {"short": "Martius & Lampert 2016", "title": "Extrapolation and learning equations", "venue": "arXiv preprint (ICLR 2017 submission, OpenReview BkgRp0FYe)", "url": "https://arxiv.org/abs/1610.02995"}}
  srbf_changes: []
  problem_flags: {"trivial": ["eql-pendulum-y1", "eql-pendulum-y1.extrap-near", "eql-pendulum-y1.extrap-far"]}
  description: EQL pendulum vector field
  sources:
  - https://arxiv.org/abs/1610.02995v1
  - https://arxiv.org/pdf/1610.02995v1
  - https://arxiv.org/e-print/1610.02995v1
  - https://openreview.net/forum?id=BkgRp0FYe
  - https://mlanthology.org/iclr/2017/martius2017iclr-extrapolation
  - https://github.com/martius-lab/EQL/tree/cd93824ccd330b814ddd334dd25e8b0fd5eb3f77
  - https://github.com/martius-lab/EQL/blob/cd93824ccd330b814ddd334dd25e8b0fd5eb3f77/EQL-DIV-ICML/ICML-Datasets.ipynb
  - https://github.com/martius-lab/EQL_Tensorflow/tree/95f6de7e9e4494fd838fbabf3622f3d76623fe2f
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  conventions:
    rules: 'srbf formula catalogs: the benchmark''s formulas, constants and input distributions; srbf draws the points (512
      to fit, 512 to test) and sets the noise; a value the authors draw anew for every run (a constant, an input''s range)
      is drawn with the points (the entry''s per_run block); srbf''s release freezes one draw per problem'
expressions:
  eql-pendulum-y1:
    raw: x2/9.81
    prepared: 0.101936799184506*v2
    n_variables: 2
    subset: interp
    vars:
      v1:
        name: x1
        sample_range:
        - -2.0
        - 2.0
        sample_type:
        - uni
        - pos
      v2:
        name: x2
        sample_range:
        - -2.0
        - 2.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x1: uniform U[-2, 2]
      x2: uniform U[-2, 2]
    meta:
      finite_fraction: 1.0
  eql-pendulum-y1.extrap-near:
    raw: x2/9.81
    prepared: 0.101936799184506*v2
    n_variables: 2
    subset: extrap-near
    vars:
      v1:
        name: x1
        sample_range:
        - -2.0
        - 2.0
        sample_type:
        - uni
        - pos
      v2:
        name: x2
        sample_range:
        - -2.0
        - 2.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x1: uniform U[-2, 2]
      x2: uniform U[-2, 2]
    test:
      vars:
        v1:
          dist:
            name: uniform
            kwargs:
              low: -3.0
              high: 3.0
        v2:
          dist:
            name: uniform
            kwargs:
              low: -3.0
              high: 3.0
      row_constraints:
      - maximum(abs(v1), abs(v2)) > 2.0
    test_source: 'Martius & Lampert 2016, ''Extrapolation and learning equations'', arXiv:1610.02995v1, results.tex (as quoted
      in the records; no local copy of the paper): training ''uniformly in the hypercube [-h,h] x [-h,h]''; test sets: interpolation
      (same distribution), extrapolation near [-3h/2,3h/2]^d \ [-h,h]^d and extrapolation far [-2h,2h]^d \ [-h,h]^d (results.tex
      l.43-47); F-1..F-3: ''We follow the same proce'
    meta:
      finite_fraction: 1.0
  eql-pendulum-y1.extrap-far:
    raw: x2/9.81
    prepared: 0.101936799184506*v2
    n_variables: 2
    subset: extrap-far
    vars:
      v1:
        name: x1
        sample_range:
        - -2.0
        - 2.0
        sample_type:
        - uni
        - pos
      v2:
        name: x2
        sample_range:
        - -2.0
        - 2.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x1: uniform U[-2, 2]
      x2: uniform U[-2, 2]
    test:
      vars:
        v1:
          dist:
            name: uniform
            kwargs:
              low: -4.0
              high: 4.0
        v2:
          dist:
            name: uniform
            kwargs:
              low: -4.0
              high: 4.0
      row_constraints:
      - maximum(abs(v1), abs(v2)) > 2.0
    test_source: 'Martius & Lampert 2016, ''Extrapolation and learning equations'', arXiv:1610.02995v1, results.tex (as quoted
      in the records; no local copy of the paper): training ''uniformly in the hypercube [-h,h] x [-h,h]''; test sets: interpolation
      (same distribution), extrapolation near [-3h/2,3h/2]^d \ [-h,h]^d and extrapolation far [-2h,2h]^d \ [-h,h]^d (results.tex
      l.43-47); F-1..F-3: ''We follow the same proce'
    meta:
      finite_fraction: 1.0
