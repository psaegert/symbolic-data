    test:
      vars:
        v1:
          dist:
          - name: uniform
            kwargs:
              low: -10.0
              high: -5.0
            weight: 5.0
          - name: uniform
            kwargs:
              low: 5.0
              high: 10.0
            weight: 5.0
        v2:
          dist:
          - name: uniform
            kwargs:
              low: -10.0
              high: -5.0
            weight: 5.0
          - name: uniform
            kwargs:
              low: 5.0
              high: 10.0
            weight: 5.0
    test_source: 'Morales & Sheppard, ''Decomposable Neural Symbolic Regression'', arXiv:2511.04124v4 main.tex l.1261-1265
      (catalog-prep/raw/fresh-104/arXiv-2511.04124v4_main.tex, opened): ''The original domain range, or interpolation range,
