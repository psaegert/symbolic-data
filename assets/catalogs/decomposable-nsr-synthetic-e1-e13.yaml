metadata:
  name: decomposable-nsr-synthetic-e1-e13
  version: 1
  tags: {"origin": "classic benchmark", "tags": ["extrapolation", "several tests"]}
  license: "MIT (NISL-MSU/MultiSetSR; Morales & Sheppard 2026, arXiv:2511.04124)"
  description: Decomposable NSR synthetic E1-E13
  sources:
  - https://arxiv.org/abs/2511.04124
  - https://arxiv.org/pdf/2511.04124v4
  - https://arxiv.org/e-print/2511.04124v4
  - https://arxiv.org/abs/2406.17834
  - https://arxiv.org/e-print/2406.17834
  - https://github.com/NISL-MSU/MultiSetSR
  - https://github.com/NISL-MSU/MultiSetSR/blob/d5ba2ecb6f5a82054d957e9b8c6842e3d6d92831/src/EquationLearning/Data/GenerateDatasets.py
  - https://github.com/NISL-MSU/MultiSetSR/blob/d5ba2ecb6f5a82054d957e9b8c6842e3d6d92831/README.md
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-104.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  E1:
    raw: (3.0375*x0*x1 + 5.5*sin(9/4*(x0 - 2/3)*(x1 - 2/3)))/5
    prepared: 0.6075*v1*v2 + 1.1*sin(9*(v1 - 1*2/3)*(v2 - 1*2/3)/4)
    n_variables: 2
    subset: interp
    vars:
      v1:
        name: x0
        sample_range:
        - -5.0
        - 5.0
        sample_type:
        - uni
        - pos
      v2:
        name: x1
        sample_range:
        - -5.0
        - 5.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x0: 'uniform U[-5,5] (authors'' generator: np.random.uniform(-5, 5, size=n), MultiSetSR @ d5ba2ecb src/EquationLearning/Data/GenerateDatasets.py
        (raw/fresh-104/GenerateDatasets.py, sha256 9f02f5d4...0cc) L210)'
      x1: 'uniform U[-5,5] (authors'' generator: np.random.uniform(-5, 5, size=n), MultiSetSR @ d5ba2ecb src/EquationLearning/Data/GenerateDatasets.py
        (raw/fresh-104/GenerateDatasets.py, sha256 9f02f5d4...0cc) L211)'
    meta:
      finite_fraction: 1.0
  E1.extrap:
    raw: (3.0375*x0*x1 + 5.5*sin(9/4*(x0 - 2/3)*(x1 - 2/3)))/5
    prepared: 0.6075*v1*v2 + 1.1*sin(9*(v1 - 1*2/3)*(v2 - 1*2/3)/4)
