metadata:
  name: heuristiclab-regression-instance-providers
  version: 1
  tags: {"origin": "classic benchmark", "tags": ["dummy inputs"]}
  license: "facts only: formulas cited from the defining authors and instances generated with HeuristicLab's providers (heal-research/HeuristicLab, GPL-3.0 code, not copied)"
  description: HeuristicLab regression instance providers
  sources:
  - https://github.com/heal-research/HeuristicLab
  - https://github.com/heal-research/HeuristicLab/blob/c57538bf4bf4e944e75bcac0468c33ec5a27d4bf/HeuristicLab.Problems.Instances.DataAnalysis/3.3/Regression
