  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-46.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  Keijzer-5:
    raw: 30*x*z/((x - 10)*y**2)
    prepared: 30*v1*v3/(v2**2*(v1 - 10))
    n_variables: 3
    subset: all
    vars:
      v1:
        name: x
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v2:
        name: y
        sample_range:
        - 1.0
        - 2.0
        sample_type:
        - uni
        - pos
      v3:
        name: z
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x: uniform U[-1.0,1.0]
      y: uniform U[1.0,2.0]
      z: uniform U[-1.0,1.0]
    meta:
      finite_fraction: 1.0
