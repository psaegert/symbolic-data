metadata:
  name: gsr-symset
  version: 1
  tags: {"origin": "classic benchmark", "tags": []}
  srbf_changes: []
  license: "facts only: formulas and ranges cited from Tohme et al. 2023 (GSR, TMLR, arXiv:2205.15569), Table 20; no upstream license"
  citation: {"paper": {"short": "Tohme et al. 2022", "title": "GSR: A Generalized Symbolic Regression Approach", "venue": "Transactions on Machine Learning Research (12/2022)", "url": "https://arxiv.org/abs/2205.15569"}}
  description: GSR SymSet
  sources:
  - https://arxiv.org/abs/2205.15569
  - https://arxiv.org/e-print/2205.15569v2
  - https://arxiv.org/e-print/2205.15569v1
  - https://arxiv.org/pdf/2205.15569v2
  - https://openreview.net/forum?id=lheUXtDNvP
  - https://www.merl.com/publications/TR2023-002
  - https://mlanthology.org/tmlr/2023/tohme2023tmlr-gsr/
  sampling_defaults:
    n_points: 512
    method: random
    noise: 0.0
  source_kind: set
  source_record: catalog-prep/sets/fresh-109.json
  conventions:
    rules: 'srbf formula catalogs (srbf ruling 2026-10-01/05): the benchmark''s formulas, constants and input distributions;
      srbf draws 512 + 512 points per run and sets the noise; constants with a distribution are drawn once per problem (ruling
      9(6))'
expressions:
  SymSet-1:
    raw: x*sinh(x) - 4/5
    prepared: v1*sinh(v1) - 1*4/5
    n_variables: 1
    subset: all
    vars:
      v1:
        name: x
        sample_range:
        - -1.0
        - 1.0
        sample_type:
        - uni
        - pos
      v0:
        name: y
    input_distributions:
      x: uniform U[-1, 1]
    meta:
      finite_fraction: 1.0
