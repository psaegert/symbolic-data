[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolic-data"
version = "0.18.0"
description = "Model-agnostic symbolic-regression data layer: Problem, versioned ProblemCatalog, and ProblemSource (curated sets / on-the-fly generation / fixed)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Paul Saegert" }]
keywords = ["symbolic-regression", "dataset", "sampling", "holdout", "expression"]
dependencies = [
    "numpy",
    "scikit-learn",
    "scipy",
    "simplipy>=0.14.1,<0.15",
    "pyyaml",
    "tqdm",
    "huggingface_hub",
]

[project.optional-dependencies]
sympy = ["sympy"]
ingest = ["pandas"]
dev = ["pytest", "pytest-cov", "pandas", "sympy"]
# the catalog builders (tools/catalog_build): pandas pinned, since CSV parsing differs between versions in the last digit
# and a data catalog's bytes are pinned by sha256 (paths.BUILD_PANDAS); h5py, xlrd and openpyxl read the benchmarks' files
build = ["pandas==3.0.5", "sympy", "scipy", "pyarrow", "h5py", "xlrd", "openpyxl", "scikit-learn", "PyYAML"]

[project.scripts]
symbolic-data = "symbolic_data.__main__:main"

[project.urls]
Homepage = "https://github.com/psaegert/symbolic-data"
Repository = "https://github.com/psaegert/symbolic-data"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
symbolic_data = ["py.typed"]

[tool.flake8]
max-line-length = 250
extend-ignore = ["E203", "W503"]
per-file-ignores = ["__init__.py:F401"]
exclude = [".git", "__pycache__", "build", "dist", ".venv", "venv", "assets"]
